# Production overrides
server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.example.buildpro: INFO

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# No fallback defaults in prod - startup fails loudly if these aren't set,
# instead of silently running with the insecure admin/changeme local default.
admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
