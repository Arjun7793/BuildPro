spring:
  application:
    name: buildpro
  profiles:
    active: local
  data:
    web:
      pageable:
        # Caps ?size= on paginated endpoints (currently just GET /api/leads) so
        # a client can't request an unreasonably large page.
        max-page-size: 100
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # Caps a project photo upload (POST /api/projects/{id}/image) - big enough
      # for a normal phone/camera photo, small enough that nobody can bloat the
      # database with a huge file. GlobalExceptionHandler turns anything over
      # this into a clean 413 ApiError instead of a generic 500.
      max-file-size: 5MB
      max-request-size: 5MB
  # SMTP settings for the new-lead notification emails (see app.lead-notifications
  # below and service/impl/LeadNotificationServiceImpl.java). Defaults target
  # Gmail's SMTP relay - MAIL_USERNAME is the full Gmail address, MAIL_PASSWORD is
  # a Gmail *app password* (Google Account -> Security -> 2-Step Verification ->
  # App passwords), not the account's normal login password. Any other SMTP
  # provider (SendGrid, Resend, etc.) works too - just override MAIL_HOST/
  # MAIL_PORT along with the username/password.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Give up on an unreachable/slow SMTP server after 10 s instead of
          # waiting forever (the default). Sending is on a background thread,
          # so this only bounds how long that thread is stuck.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  # Railway (like most PaaS platforms) terminates TLS at its own edge proxy and
  # forwards to this app over plain HTTP internally, adding X-Forwarded-Proto/
  # Host/Port headers saying the original request was HTTPS. Without this,
  # Spring/Tomcat has no way to know that - request.isSecure() reports false,
  # and anything that builds an absolute URL from the request (a login redirect,
  # a Secure cookie flag) ends up using http:// even though the site is only
  # ever reached over https://, which browsers then block as mixed content.
  # "framework" makes Spring itself (not just the servlet container) honor
  # those headers. Harmless locally - there's no proxy there, so the headers
  # are simply absent and nothing changes.
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.example.buildpro: INFO
  pattern:
    # %X{requestId} pulls the correlation id RequestLoggingFilter puts in MDC,
    # so every log line for one request can be grep'd together.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n"

# Single admin account guarding /admin/** and the leads GET/DELETE endpoints
# (see config/SecurityConfig.java). Overridden per-profile / via env vars.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}

# Timezone the admin leads page displays submission times in - not where the app
# code runs (that's UTC on Railway), just how times are shown to viewers.
app:
  display-timezone: ${DISPLAY_TIMEZONE:Asia/Kolkata}
  # Per-IP rate limit on POST /api/leads (the public contact form) - see
  # filter/LeadsRateLimitFilter.java. At most max-requests submissions per
  # window-minutes from the same address before a 429.
  leads-rate-limit:
    max-requests: ${LEADS_RATE_LIMIT_MAX_REQUESTS:5}
    window-minutes: ${LEADS_RATE_LIMIT_WINDOW_MINUTES:10}
  # New-lead email notifications (see service/impl/LeadNotificationServiceImpl.java) -
  # off by default so local dev never tries to send mail with no SMTP configured.
  # Enable in prod via LEAD_NOTIFICATIONS_ENABLED=true, alongside the spring.mail.*
  # env vars below and LEAD_NOTIFICATION_EMAIL (who receives them). A failed send
  # (bad credentials, SMTP down) is only logged - it never fails the contact form
  # submission itself, since the lead is already saved in Postgres by then.
  # How emails are sent (service/mail/EmailSender.java): smtp (default, uses
  # spring.mail above), resend or brevo (HTTPS APIs, need MAIL_API_KEY). Railway
  # blocks outbound SMTP on Trial/Hobby plans, so use resend or brevo there.
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    api-key: ${MAIL_API_KEY:}
  lead-notifications:
    enabled: ${LEAD_NOTIFICATIONS_ENABLED:false}
    to: ${LEAD_NOTIFICATION_EMAIL:}
    from: ${MAIL_FROM:${spring.mail.username:}}
  # Bearer tokens for the mobile admin app (POST /api/auth/token - see
  # config/JwtConfig.java and controller/AuthController.java). The secret signs
  # every token (HS256) and must be at least 32 characters; the default below is
  # for local dev only - prod requires JWT_SECRET (see application-prod.yaml).
  # Changing the secret signs every app user out.
  jwt:
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-prod-0123456789}
    issuer: buildpro
    ttl-hours: ${JWT_TTL_HOURS:24}
  # New-lead push alerts to phones running the mobile admin app (see
  # service/impl/FcmPushNotificationServiceImpl.java). Off by default so local dev
  # needs no Firebase project. To enable: PUSH_NOTIFICATIONS_ENABLED=true plus
  # FIREBASE_CREDENTIALS_JSON = the full contents of a Firebase service-account
  # key file (Firebase console -> Project settings -> Service accounts ->
  # Generate new private key). android-channel-id must match the notification
  # channel the Flutter app creates.
  push:
    enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
    firebase-credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    android-channel-id: new_leads
  # Per-IP limit on POST /api/auth/token sign-in attempts - see
  # filter/AuthTokenRateLimitFilter.java.
  auth-rate-limit:
    max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
    window-minutes: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}

