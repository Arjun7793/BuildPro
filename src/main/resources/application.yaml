spring:
  application:
    name: buildpro
  profiles:
    active: local
  data:
    web:
      pageable:
        # Caps ?size= on paginated endpoints (currently just GET /api/leads) so
        # a client can't request an unreasonably large page.
        max-page-size: 100
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # Caps a project photo upload (POST /api/projects/{id}/image) - big enough
      # for a normal phone/camera photo, small enough that nobody can bloat the
      # database with a huge file. GlobalExceptionHandler turns anything over
      # this into a clean 413 ApiError instead of a generic 500.
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  # Railway (like most PaaS platforms) terminates TLS at its own edge proxy and
  # forwards to this app over plain HTTP internally, adding X-Forwarded-Proto/
  # Host/Port headers saying the original request was HTTPS. Without this,
  # Spring/Tomcat has no way to know that - request.isSecure() reports false,
  # and anything that builds an absolute URL from the request (a login redirect,
  # a Secure cookie flag) ends up using http:// even though the site is only
  # ever reached over https://, which browsers then block as mixed content.
  # "framework" makes Spring itself (not just the servlet container) honor
  # those headers. Harmless locally - there's no proxy there, so the headers
  # are simply absent and nothing changes.
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.example.buildpro: INFO
  pattern:
    # %X{requestId} pulls the correlation id RequestLoggingFilter puts in MDC,
    # so every log line for one request can be grep'd together.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n"

# Single admin account guarding /admin/** and the leads GET/DELETE endpoints
# (see config/SecurityConfig.java). Overridden per-profile / via env vars.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:changeme}

# Timezone the admin leads page displays submission times in - not where the app
# code runs (that's UTC on Railway), just how times are shown to viewers.
app:
  display-timezone: ${DISPLAY_TIMEZONE:Asia/Kolkata}
  # Per-IP rate limit on POST /api/leads (the public contact form) - see
  # filter/LeadsRateLimitFilter.java. At most max-requests submissions per
  # window-minutes from the same address before a 429.
  leads-rate-limit:
    max-requests: ${LEADS_RATE_LIMIT_MAX_REQUESTS:5}
    window-minutes: ${LEADS_RATE_LIMIT_WINDOW_MINUTES:10}
