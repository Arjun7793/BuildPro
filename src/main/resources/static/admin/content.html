<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildPro Admin - Content</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{
overflow-x:hidden;
}

body{
background:#f7f7f7;
color:#333;
}

header{
background:#222;
padding:12px 5%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1001;
}

.logo{
font-size:26px;
font-weight:700;
color:#ffb400;
display:flex;
align-items:center;
flex-wrap:wrap;
row-gap:2px;
min-width:0;
overflow:hidden;
}

.logo span{
color:white;
font-weight:400;
font-size:16px;
margin-left:10px;
}

.logo #brand-name{
color:#ffb400;
font-weight:700;
font-size:26px;
margin-left:0;
}

/* .header-actions is an off-canvas slide-in panel by default (mobile);
   min-width:769px below turns it back into a plain inline row. */
.header-actions{
display:flex;
flex-direction:column;
align-items:flex-start;
gap:6px;
position:fixed;
top:0;
right:0;
height:100vh;
width:min(78%,300px);
background:#222;
padding:90px 30px 30px;
box-shadow:-10px 0 30px rgba(0,0,0,.3);
transform:translateX(100%);
transition:transform .3s ease;
z-index:1000;
}

.header-actions.open{
transform:translateX(0);
}

.header-actions .nav-link,.header-actions .btn{
width:100%;
text-align:left;
}

.header-actions .nav-link{
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,.12);
}

.nav-backdrop{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:999;
}

.nav-backdrop.open{
display:block;
}

body.nav-open-lock{
overflow:hidden;
}

/* Hamburger button - the default (mobile) way to open .header-actions;
   hidden again at desktop widths below, where it's a plain inline row. */
.nav-toggle{
display:flex;
flex-direction:column;
justify-content:space-between;
width:24px;
height:18px;
background:none;
border:none;
padding:0;
cursor:pointer;
z-index:1002;
flex-shrink:0;
}

.nav-toggle span{
display:block;
height:3px;
width:100%;
background:#fff;
border-radius:2px;
transition:.3s;
}

.nav-toggle.active span:nth-child(1){
transform:translateY(7.5px) rotate(45deg);
}

.nav-toggle.active span:nth-child(2){
opacity:0;
}

.nav-toggle.active span:nth-child(3){
transform:translateY(-7.5px) rotate(-45deg);
}


.nav-link{
color:#ccc;
text-decoration:none;
font-size:14px;
font-weight:500;
transition:.3s;
background:none;
border:none;
cursor:pointer;
font-family:'Poppins',sans-serif;
}

.nav-link:hover{
color:#ffb400;
}

main{
padding:30px 5%;
}

.title{
font-size:32px;
color:#222;
margin-bottom:10px;
}

.subtitle{
color:#777;
margin-bottom:40px;
}

.section{
margin-bottom:50px;
}

.section-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.section-title{
font-size:22px;
color:#222;
display:flex;
align-items:center;
gap:10px;
}

.section-count{
font-size:13px;
color:#999;
font-weight:400;
}

.btn{
padding:10px 22px;
background:#ffb400;
color:#222;
font-weight:bold;
border:none;
border-radius:5px;
cursor:pointer;
transition:.3s;
font-size:14px;
}

.btn:hover{
background:#222;
color:#ffb400;
}

.btn-secondary{
background:none;
border:1px solid #ccc;
color:#555;
}

.btn-secondary:hover{
background:#eee;
color:#333;
}

.card{
background:none;
box-shadow:none;
}

table{
width:100%;
border-collapse:collapse;
}

thead th{
text-align:left;
background:#222;
color:#ffb400;
padding:14px 20px;
font-weight:600;
font-size:13px;
text-transform:uppercase;
letter-spacing:.5px;
}

tbody td{
padding:6px 0;
border-bottom:none;
vertical-align:top;
font-size:15px;
}

/* Card-row layout is the default (mobile) table presentation - real
   <table> layout with visible column headers only comes back at
   min-width:769px, in the media query near the bottom of this block. */
table,thead,tbody,th,td,tr{
display:block;
}

thead{
display:none;
}

tbody tr{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:16px;
padding:16px;
}

tbody td::before{
content:attr(data-label);
display:block;
font-size:11px;
text-transform:uppercase;
color:#aaa;
margin-bottom:2px;
}

tbody tr:last-child td{
border-bottom:none;
}

tbody tr:hover{
background:#fafafa;
}

.thumb{
width:60px;
height:44px;
object-fit:cover;
border-radius:5px;
display:block;
}

.text-cell{
max-width:none;
color:#555;
overflow:hidden;
text-overflow:ellipsis;
white-space:normal;
}

.row-actions{
display:flex;
gap:8px;
white-space:nowrap;
}

.icon-btn{
background:none;
border:1px solid #ccc;
color:#555;
padding:6px 14px;
border-radius:5px;
cursor:pointer;
font-size:13px;
font-weight:600;
transition:.3s;
}

.icon-btn:hover{
background:#222;
color:#ffb400;
border-color:#222;
}

.icon-btn.delete{
border-color:#d9534f;
color:#d9534f;
}

.icon-btn.delete:hover{
background:#d9534f;
color:white;
}

.empty-state,.error-state,.loading-state{
padding:40px 20px;
text-align:center;
color:#888;
font-size:14px;
}

.drag-handle{
width:28px;
color:#bbb;
cursor:grab;
font-size:16px;
text-align:center;
user-select:none;
}

tbody tr.draggable-row[draggable="true"]:active .drag-handle{
cursor:grabbing;
}

tbody tr.dragging{
opacity:.4;
}

tbody tr.drag-over{
box-shadow:inset 0 2px 0 #ffb400;
}

.reorder-hint{
font-size:12px;
color:#999;
font-weight:400;
margin-left:8px;
}

.image-field-current{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.image-field-current img{
width:70px;
height:52px;
object-fit:cover;
border-radius:5px;
border:1px solid #eee;
}

.image-field-current span{
font-size:12px;
color:#888;
}

.field input[type="file"]{
padding:8px;
border:1px dashed #ccc;
background:#fafafa;
}

.upload-progress{
font-size:12px;
color:#888;
margin-top:6px;
}

.toast{
position:fixed;
top:24px;
left:50%;
transform:translateX(-50%) translateY(-12px);
background:#222;
color:white;
padding:14px 24px;
border-radius:8px;
font-size:14px;
font-weight:500;
box-shadow:0 8px 24px rgba(0,0,0,.25);
z-index:2000;
opacity:0;
pointer-events:none;
transition:opacity .25s, transform .25s;
display:flex;
align-items:center;
gap:10px;
}

.toast.visible{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.toast::before{
content:'\2713';
color:#ffb400;
font-weight:700;
}

.toast.toast-error::before{
content:'!';
color:#d9534f;
}

.error-state{
color:#d9534f;
}

footer{
background:#111;
color:white;
text-align:center;
padding:24px;
font-size:14px;
}

/* Modal */

.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:1000;
}

.modal-overlay[hidden]{
display:none;
}

.modal{
background:white;
border-radius:10px;
width:100%;
max-width:480px;
max-height:90vh;
overflow-y:auto;
box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.modal-header{
padding:22px 26px;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
}

.modal-header h2{
font-size:20px;
color:#222;
}

.modal-close{
background:none;
border:none;
font-size:22px;
color:#999;
cursor:pointer;
line-height:1;
}

.modal-close:hover{
color:#333;
}

.modal-body{
padding:22px 26px;
}

.field{
margin-bottom:18px;
}

.field label{
display:block;
font-size:13px;
font-weight:600;
color:#555;
margin-bottom:6px;
}

.field input,.field textarea{
width:100%;
padding:12px 14px;
border:1px solid #ccc;
border-radius:5px;
font-size:14px;
font-family:'Poppins',sans-serif;
}

.field textarea{
resize:vertical;
min-height:80px;
}

.field .hint{
font-size:12px;
color:#999;
margin-top:4px;
}

.modal-footer{
padding:18px 26px;
border-top:1px solid #eee;
display:flex;
justify-content:flex-end;
gap:12px;
}

.modal-error{
color:#d9534f;
font-size:13px;
margin-top:-8px;
margin-bottom:14px;
min-height:16px;
}

.field-invalid input,.field-invalid textarea{
border-color:#d9534f;
}

.field-error-msg{
color:#d9534f;
font-size:12px;
margin-top:4px;
}

/* ============================================================
   min-width:769px - layer the wider-screen version back on top:
   plain inline header nav, a real <table> instead of card rows,
   roomier spacing.
   ============================================================ */
@media(min-width:769px){

header{
padding:18px 8%;
}

.nav-toggle{
display:none;
}

.header-actions{
position:static;
height:auto;
width:auto;
background:none;
flex-direction:row;
align-items:center;
gap:20px;
padding:0;
box-shadow:none;
transform:none;
}

.header-actions .nav-link,.header-actions .btn{
width:auto;
text-align:left;
}

.header-actions .nav-link{
padding:0;
border-bottom:none;
}

main{
padding:50px 8%;
}

.card{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
overflow:hidden;
}

table,thead,tbody,th,td,tr{
display:revert;
}

thead{
display:table-header-group;
}

tbody tr{
background:none;
border-radius:0;
box-shadow:none;
margin-bottom:0;
padding:0;
}

tbody tr:hover{
background:#fafafa;
}

tbody tr:last-child td{
border-bottom:none;
}

tbody td{
padding:14px 20px;
border-bottom:1px solid #eee;
}

tbody td::before{
display:none;
}

.text-cell{
max-width:280px;
white-space:nowrap;
}

}

</style>
</head>
<body>

<header>
<div class="logo"><span id="brand-name">BuildPro</span><span>Admin &middot; Content</span></div>
<button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="header-actions">
<span></span>
<span></span>
<span></span>
</button>
<div class="header-actions" id="header-actions">
<a class="nav-link" href="/admin">&larr; Dashboard</a>
<a class="nav-link" href="/admin/leads">View leads &rarr;</a>
<button class="nav-link" id="logout-btn" type="button">Log out</button>
</div>
</header>

<div class="nav-backdrop" id="nav-backdrop"></div>

<main>
<div class="title">Site content</div>
<div class="subtitle">Everything shown on the public page, editable here. Changes go live immediately.</div>

<div id="sections"></div>
</main>

<footer>&copy; <span id="year"></span> <span id="brand-name-footer">BuildPro Construction</span> &mdash; Admin area</footer>

<div class="toast" id="toast" hidden></div>

<div class="modal-overlay" id="modal-overlay" hidden>
<div class="modal">
<div class="modal-header">
<h2 id="modal-title">Add item</h2>
<button class="modal-close" id="modal-close" type="button">&times;</button>
</div>
<form id="modal-form">
<div class="modal-body" id="modal-body"></div>
<div class="modal-body" style="padding-top:0">
<div class="modal-error" id="modal-error"></div>
</div>
<div class="modal-footer">
<button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
<button type="submit" class="btn" id="modal-save">Save</button>
</div>
</form>
</div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// Same wiring as the public site: the admin pages also hardcoded "BuildPro"
// in the title/logo/footer with no way to change it. Company name (set in
// /admin/content -> Company info) now drives all of them here too, fetched
// from the same public GET /api/company-info the public site uses - no admin
// session needed, so this works on the login page as well. Falls back to the
// "BuildPro" text already in the page if the request fails or nothing's been
// configured yet.
//
// Named (not a fire-once IIFE) because this page is the one place an admin
// can actually change company info without navigating away - the header/
// title/footer here need to re-fetch right after that save, or they'd keep
// showing the old name until a manual reload. Every other admin page only
// ever needs this once, at load, since editing happens over here.
// Captured once, from the page's real static title, before anything ever
// rewrites it - "refreshBranding" runs more than once on this page (once at
// load, again after every company-info save), and replacing "BuildPro" in
// document.title in place only works the FIRST time: the second call would
// find "Acme Corp Admin - Content" instead of "BuildPro Admin - Content" and
// its regex would no longer match, silently freezing the title on whatever
// name was set first.
var titleSuffix = document.title.replace(/^BuildPro/, '');

function refreshBranding(){
fetch('/api/company-info', {credentials:'same-origin'}).then(function(res){
return res.ok ? res.json() : [];
}).then(function(records){
var name = (records && records[0] && records[0].companyName || '').trim();
if(!name) return;
document.title = name + titleSuffix;
var brandEl = document.getElementById('brand-name');
if(brandEl) brandEl.textContent = name;
var brandFooterEl = document.getElementById('brand-name-footer');
if(brandFooterEl) brandFooterEl.textContent = name;
}).catch(function(){
// Keep whatever's already showing - stale is better than broken.
});
}
refreshBranding();


// One entry per content type. `path` is the REST base path, `columns` drive the
// table (key into the item + a display label), `fields` drive the add/edit form
// (name/label/type/required/placeholder), matching the entities in
// com.example.buildpro.entity.
var SECTIONS = [
  {
    key: 'services',
    title: 'Services',
    path: '/api/services',
    singular: 'service',
    sortable: true,
    columns: [
      {key:'title', label:'Title'},
      {key:'description', label:'Description', text:true},
      {key:'displayOrder', label:'Order'}
    ],
    fields: [
      {name:'title', label:'Title', type:'text', required:true},
      {name:'description', label:'Description', type:'textarea'}
    ]
  },
  {
    key: 'stats',
    title: 'Stats',
    path: '/api/stats',
    singular: 'stat',
    sortable: true,
    columns: [
      {key:'label', label:'Label'},
      {key:'targetValue', label:'Value'},
      {key:'displayOrder', label:'Order'}
    ],
    fields: [
      {name:'label', label:'Label', type:'text', required:true, placeholder:'e.g. Projects Completed'},
      {name:'targetValue', label:'Value', type:'number', required:true}
    ]
  },
  {
    key: 'projects',
    title: 'Projects',
    path: '/api/projects',
    singular: 'project',
    sortable: true,
    columns: [
      {key:'imageUrl', label:'Image', image:true},
      {key:'title', label:'Title'},
      {key:'displayOrder', label:'Order'}
    ],
    fields: [
      // Hybrid control (see openModal/handleProjectImageUpload): either paste a
      // URL, or pick a file to upload after the item is saved - whichever the
      // admin used most recently wins. The URL input is prefilled with the
      // item's current imageUrl on edit so leaving it untouched doesn't wipe an
      // uploaded photo (ProjectItemServiceImpl only clears the stored image
      // when the incoming imageUrl actually changes to something else).
      // Not marked required here - it's validated as "URL or a picked file"
      // together (see the image-field check in the submit handler), which a
      // plain HTML `required` attribute on just the text input can't express.
      {name:'imageUrl', label:'Image URL', type:'image', placeholder:'https://...'},
      {name:'title', label:'Title', type:'text', required:true}
    ]
  },
  {
    key: 'testimonials',
    title: 'Testimonials',
    path: '/api/testimonials',
    singular: 'testimonial',
    sortable: true,
    columns: [
      {key:'clientName', label:'Client'},
      {key:'message', label:'Message', text:true},
      {key:'rating', label:'Rating'},
      {key:'displayOrder', label:'Order'}
    ],
    fields: [
      {name:'clientName', label:'Client name', type:'text', required:true},
      {name:'message', label:'Message', type:'textarea'},
      {name:'rating', label:'Rating (1-5)', type:'number'}
    ]
  },
  {
    key: 'company-info',
    title: 'Company info',
    path: '/api/company-info',
    singular: 'company info record',
    // There's only ever meant to be one of these (the public site and now the
    // admin pages themselves both read the first record as THE company info -
    // see renderCompanyInfo/company-info branding wiring). A second record
    // would be ambiguous (which one wins?) and deleting the only one would
    // blank out the site's name everywhere. singleton hides "+ Add" once one
    // exists and drops the Delete action, leaving only Edit.
    singleton: true,
    columns: [
      {key:'companyName', label:'Company'},
      {key:'address', label:'Address', text:true},
      {key:'phone', label:'Phone'},
      {key:'email', label:'Email'}
    ],
    fields: [
      {name:'companyName', label:'Company name', type:'text', required:true,
        hint:'Also used as the public site\'s name - the page title, header logo, and footer credit.'},
      {name:'address', label:'Address', type:'text'},
      {name:'phone', label:'Phone', type:'text'},
      {name:'email', label:'Email', type:'text'}
    ]
  }
];

var sectionsEl = document.getElementById('sections');
var overlay = document.getElementById('modal-overlay');
var modalTitle = document.getElementById('modal-title');
var modalBody = document.getElementById('modal-body');
var modalForm = document.getElementById('modal-form');
var modalError = document.getElementById('modal-error');
var modalSaveBtn = document.getElementById('modal-save');

var activeSection = null;
var activeItem = null;

function escapeHtml(str){
if(str === null || str === undefined) return '';
return String(str)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;');
}

// The CSRF token Spring Security issues via a readable cookie (see
// config/CsrfCookieFilter.java) - sent back as a header on every write, the
// standard pattern for a JS-driven admin page using session/cookie login
// instead of a server-rendered form.
function getCookie(name){
var match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
return match ? decodeURIComponent(match[1]) : '';
}

function csrfHeaders(){
return {'X-XSRF-TOKEN': getCookie('XSRF-TOKEN')};
}

// One consistent success/error toast for every create/update/delete across all
// five sections, instead of some actions (image upload in particular) leaving
// the admin guessing whether anything happened.
var toastEl = document.getElementById('toast');
var toastTimer = null;

function showToast(message, isError){
clearTimeout(toastTimer);
toastEl.textContent = message;
toastEl.classList.toggle('toast-error', !!isError);
toastEl.hidden = false;
// Reflow before adding the visible class so the transition actually plays,
// rather than the toast just appearing already at its final state.
void toastEl.offsetWidth;
toastEl.classList.add('visible');
toastTimer = setTimeout(function(){
toastEl.classList.remove('visible');
setTimeout(function(){ toastEl.hidden = true; }, 250);
}, 3000);
}

function buildSectionMarkup(section){
return '' +
'<div class="section" id="section-' + section.key + '">' +
'<div class="section-header">' +
'<div class="section-title">' + section.title + ' <span class="section-count" id="count-' + section.key + '"></span></div>' +
'<button class="btn" id="add-btn-' + section.key + '" data-add="' + section.key + '">+ Add ' + section.singular + '</button>' +
'</div>' +
'<div class="card"><div id="body-' + section.key + '"><div class="loading-state">Loading&hellip;</div></div></div>' +
'</div>';
}

SECTIONS.forEach(function(section){
sectionsEl.insertAdjacentHTML('beforeend', buildSectionMarkup(section));
});

sectionsEl.addEventListener('click', function(e){
var addBtn = e.target.closest('[data-add]');
if(addBtn){
var section = SECTIONS.find(function(s){ return s.key === addBtn.getAttribute('data-add'); });
openModal(section, null);
return;
}
var editBtn = e.target.closest('[data-edit]');
if(editBtn){
var section = SECTIONS.find(function(s){ return s.key === editBtn.getAttribute('data-section'); });
var id = editBtn.getAttribute('data-edit');
var item = section._items.find(function(i){ return String(i.id) === String(id); });
openModal(section, item);
return;
}
var delBtn = e.target.closest('[data-delete]');
if(delBtn){
var section = SECTIONS.find(function(s){ return s.key === delBtn.getAttribute('data-section'); });
var id = delBtn.getAttribute('data-delete');
deleteItem(section, id, delBtn);
return;
}
});

async function loadSection(section){
var bodyEl = document.getElementById('body-' + section.key);
var countEl = document.getElementById('count-' + section.key);
bodyEl.innerHTML = '<div class="loading-state">Loading&hellip;</div>';
try{
var res = await fetch(section.path, {credentials:'same-origin'});
if(res.status === 401){
throw new Error('not signed in as admin - reload and sign in again');
}
if(!res.ok){
throw new Error('Request failed with status ' + res.status);
}
var items = await res.json();
section._items = items;
countEl.textContent = items.length + (items.length === 1 ? ' item' : ' items');
renderTable(section, bodyEl, items);

// Singleton sections (company-info): once a record exists, there's nothing
// meaningful to "+ Add" a second of - hide the button rather than let an
// admin create a duplicate that only one of the two could ever actually
// drive the site name.
if(section.singleton){
var addBtn = document.getElementById('add-btn-' + section.key);
if(addBtn) addBtn.hidden = items.length > 0;
}
}catch(err){
bodyEl.innerHTML = '<div class="error-state">Couldn\'t load ' + section.title.toLowerCase() + ': ' + escapeHtml(err.message) + '</div>';
countEl.textContent = '';
}
}

function renderCell(col, item){
var value = item[col.key];
if(col.image){
return value ? '<img class="thumb" src="' + escapeHtml(value) + '" alt="">' : '&mdash;';
}
if(col.text){
return '<span class="text-cell" title="' + escapeHtml(value || '') + '">' + (value ? escapeHtml(value) : '&mdash;') + '</span>';
}
return value === null || value === undefined || value === '' ? '&mdash;' : escapeHtml(value);
}

function renderTable(section, bodyEl, items){
if(items.length === 0){
bodyEl.innerHTML = '<div class="empty-state">Nothing here yet. Use "+ Add ' + section.singular + '" to create one.</div>';
return;
}

var handleHeader = section.sortable ? '<th></th>' : '';
var headerCells = handleHeader + section.columns.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '<th></th>';

var rows = items.map(function(item){
var handleCell = section.sortable ? '<td class="drag-handle" title="Drag to reorder">&#8942;&#8942;</td>' : '';
var cells = section.columns.map(function(col){
return '<td data-label="' + col.label + '">' + renderCell(col, item) + '</td>';
}).join('');
var dragAttrs = section.sortable ? ' class="draggable-row" draggable="true"' : '';
// Singleton sections (company-info) get Edit only - no Delete, since
// removing the only record would blank out the site's name everywhere that
// now reads it (public site header/footer/title, all four admin pages).
var deleteBtn = section.singleton ? '' :
'<button class="icon-btn delete" data-delete="' + item.id + '" data-section="' + section.key + '">Delete</button>';
return '<tr' + dragAttrs + ' data-id="' + item.id + '">' + handleCell + cells +
'<td data-label="Action"><div class="row-actions">' +
'<button class="icon-btn" data-edit="' + item.id + '" data-section="' + section.key + '">Edit</button>' +
deleteBtn +
'</div></td></tr>';
}).join('');

bodyEl.innerHTML = '<table><thead><tr>' + headerCells + '</tr></thead><tbody>' + rows + '</tbody></table>';

if(section.sortable){
wireDragAndDrop(section, bodyEl);
}
}

// Native HTML5 drag-and-drop, reusing the existing generic PUT {path}/{id}
// endpoint for whichever items' displayOrder actually changed - no new backend
// endpoint needed for this. Reordering is entirely client-side until drop:
// only then are the affected rows persisted.
var dragState = null;

function wireDragAndDrop(section, bodyEl){
var tbody = bodyEl.querySelector('tbody');
if(!tbody) return;

tbody.querySelectorAll('tr.draggable-row').forEach(function(row){
row.addEventListener('dragstart', function(e){
dragState = {section: section, id: row.getAttribute('data-id')};
row.classList.add('dragging');
e.dataTransfer.effectAllowed = 'move';
try{ e.dataTransfer.setData('text/plain', row.getAttribute('data-id')); }catch(_){}
});

row.addEventListener('dragend', function(){
row.classList.remove('dragging');
tbody.querySelectorAll('tr.drag-over').forEach(function(r){ r.classList.remove('drag-over'); });
dragState = null;
});

row.addEventListener('dragover', function(e){
if(!dragState || dragState.section !== section) return;
e.preventDefault();
e.dataTransfer.dropEffect = 'move';
if(row.getAttribute('data-id') !== dragState.id){
row.classList.add('drag-over');
}
});

row.addEventListener('dragleave', function(){
row.classList.remove('drag-over');
});

row.addEventListener('drop', function(e){
e.preventDefault();
row.classList.remove('drag-over');
if(!dragState || dragState.section !== section) return;
var draggedId = dragState.id;
var targetId = row.getAttribute('data-id');
if(draggedId === targetId) return;
reorderItems(section, draggedId, targetId);
});
});
}

async function reorderItems(section, draggedId, targetId){
var items = section._items;
var fromIndex = items.findIndex(function(i){ return String(i.id) === String(draggedId); });
var toIndex = items.findIndex(function(i){ return String(i.id) === String(targetId); });
if(fromIndex === -1 || toIndex === -1) return;

var moved = items.splice(fromIndex, 1)[0];
items.splice(toIndex, 0, moved);

// Renumber sequentially in the new order, then persist only the items whose
// displayOrder actually changed - usually just the ones between the old and
// new position, not the whole list.
var changed = [];
items.forEach(function(item, index){
var newOrder = index + 1;
if(item.displayOrder !== newOrder){
item.displayOrder = newOrder;
changed.push(item);
}
});

var bodyEl = document.getElementById('body-' + section.key);
renderTable(section, bodyEl, items);

try{
for(var i = 0; i < changed.length; i++){
var item = changed[i];
var res = await fetch(section.path + '/' + item.id, {
method: 'PUT',
credentials: 'same-origin',
headers: Object.assign({'Content-Type': 'application/json'}, csrfHeaders()),
body: JSON.stringify(item)
});
if(!res.ok){
throw new Error('Save failed with status ' + res.status);
}
}
if(changed.length > 0){
showToast('Order updated.');
}
}catch(err){
showToast('Couldn\'t save the new order: ' + err.message + '. Reloading the current order.', true);
loadSection(section);
}
}

// Set when the admin picks a file in the image field's file input - read on
// submit and, if present, uploaded via a separate multipart POST after the
// item itself is created/updated (see handleImageUploadIfNeeded).
var pendingImageFile = null;

function openModal(section, item){
activeSection = section;
activeItem = item;
pendingImageFile = null;
modalTitle.textContent = (item ? 'Edit ' : 'Add ') + section.singular;
modalError.textContent = '';

modalBody.innerHTML = section.fields.map(function(field){
var value = item ? item[field.name] : '';

if(field.type === 'image'){
var currentPreview = (item && value) ?
'<div class="image-field-current"><img src="' + escapeHtml(value) + '" alt=""><span>Current image</span></div>' : '';
return '<div class="field">' +
'<label>' + field.label + ' *</label>' +
currentPreview +
'<input type="text" name="' + field.name + '" value="' + escapeHtml(value) + '"' +
(field.placeholder ? ' placeholder="' + escapeHtml(field.placeholder) + '"' : '') + '>' +
'<div class="hint">Paste a URL, or upload a photo below instead.</div>' +
'<input type="file" accept="image/*" data-image-upload-for="' + field.name + '" style="margin-top:10px">' +
'<div class="upload-progress" id="upload-progress" hidden></div>' +
'</div>';
}

var input = field.type === 'textarea'
? '<textarea name="' + field.name + '"' + (field.required ? ' required' : '') + (field.placeholder ? ' placeholder="' + escapeHtml(field.placeholder) + '"' : '') + '>' + escapeHtml(value) + '</textarea>'
: '<input type="' + field.type + '" name="' + field.name + '" value="' + escapeHtml(value) + '"' + (field.required ? ' required' : '') + (field.placeholder ? ' placeholder="' + escapeHtml(field.placeholder) + '"' : '') + '>';
return '<div class="field"><label>' + field.label + (field.required ? ' *' : '') + '</label>' + input +
(field.hint ? '<div class="hint">' + field.hint + '</div>' : '') + '</div>';
}).join('');

var fileInput = modalBody.querySelector('[data-image-upload-for]');
if(fileInput){
fileInput.addEventListener('change', function(){
pendingImageFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
});
}

overlay.hidden = false;
}

function closeModal(){
overlay.hidden = true;
activeSection = null;
activeItem = null;
pendingImageFile = null;
modalForm.reset();
}

// Maps the ApiError.fieldErrors map from a 400 validation response ({title:
// "title is required", ...}) onto the matching form fields, instead of only
// showing the generic top-level message above the Save button.
// Removes any field-invalid styling/messages left over from a previous failed
// attempt in this same modal session, so retrying doesn't stack duplicate
// error text under a field.
function clearFieldErrors(){
modalBody.querySelectorAll('.field-invalid').forEach(function(fieldEl){
fieldEl.classList.remove('field-invalid');
});
modalBody.querySelectorAll('.field-error-msg').forEach(function(msg){
msg.remove();
});
}

function applyFieldErrors(fieldErrors){
if(!fieldErrors) return;
Object.keys(fieldErrors).forEach(function(name){
var input = modalForm.elements[name];
if(!input) return;
var fieldEl = input.closest('.field');
if(!fieldEl) return;
fieldEl.classList.add('field-invalid');
var msg = document.createElement('div');
msg.className = 'field-error-msg';
msg.textContent = fieldErrors[name];
fieldEl.appendChild(msg);
});
}

// The image field is really two inputs (a URL text box and a file picker)
// standing in for one requirement: the project needs SOME image, one way or
// the other. A plain HTML `required` on the text input alone would block a
// perfectly valid file-only submission, so this checks both together and
// reports the error the same way applyFieldErrors does (keyed by the URL
// input's field name, since that's the visible field admins will look at).
function validateImageField(section){
var imageField = section.fields.find(function(f){ return f.type === 'image'; });
if(!imageField) return true;
var urlValue = modalForm.elements[imageField.name].value.trim();
if(urlValue || pendingImageFile){
return true;
}
applyFieldErrors(Object.fromEntries([[imageField.name, 'Add an image URL or upload a photo.']]));
return false;
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
overlay.addEventListener('click', function(e){
if(e.target === overlay) closeModal();
});

// Uploads the picked file to POST /api/projects/{id}/image after the project
// itself has been created/updated - the upload endpoint replaces imageUrl with
// the project's own serving path itself, so nothing here needs to reconcile
// the two.
async function handleImageUploadIfNeeded(section, savedItem){
if(!pendingImageFile || !section.fields.some(function(f){ return f.type === 'image'; })) return savedItem;

var progressEl = document.getElementById('upload-progress');
if(progressEl){ progressEl.hidden = false; progressEl.textContent = 'Uploading image…'; }

var formData = new FormData();
formData.append('file', pendingImageFile);

var res = await fetch(section.path + '/' + savedItem.id + '/image', {
method: 'POST',
credentials: 'same-origin',
headers: csrfHeaders(),
body: formData
});
if(!res.ok){
var errorBody = null;
try{ errorBody = await res.json(); }catch(_){}
var message = (errorBody && errorBody.message) ? errorBody.message : ('Image upload failed with status ' + res.status);
throw new Error(message);
}
return await res.json();
}

modalForm.addEventListener('submit', async function(e){
e.preventDefault();
if(!activeSection) return;

clearFieldErrors();
modalError.textContent = '';

if(!validateImageField(activeSection)){
return;
}

var payload = {};
activeSection.fields.forEach(function(field){
var raw = modalForm.elements[field.name].value;
if(field.type === 'number'){
payload[field.name] = raw === '' ? null : Number(raw);
}else{
payload[field.name] = raw === '' ? null : raw;
}
});

// New items in a sortable section go to the end - display order is otherwise
// only ever changed by dragging, not typed in, so there's no form field for it.
// Scoped to sortable sections only: non-sortable entities (company-info) have
// no displayOrder property at all, and Spring's default Jackson config rejects
// unknown JSON properties on deserialization.
if(activeSection.sortable){
if(activeItem){
payload.displayOrder = activeItem.displayOrder;
}else{
var maxOrder = (activeSection._items || []).reduce(function(max, i){
return Math.max(max, i.displayOrder || 0);
}, 0);
payload.displayOrder = maxOrder + 1;
}
}

modalSaveBtn.disabled = true;
modalSaveBtn.textContent = 'Saving…';
modalError.textContent = '';

try{
var url = activeItem ? activeSection.path + '/' + activeItem.id : activeSection.path;
var method = activeItem ? 'PUT' : 'POST';
var res = await fetch(url, {
method: method,
credentials: 'same-origin',
headers: Object.assign({'Content-Type': 'application/json'}, csrfHeaders()),
body: JSON.stringify(payload)
});
if(!res.ok){
var errorBody = null;
try{ errorBody = await res.json(); }catch(_){}
if(errorBody && errorBody.fieldErrors){
applyFieldErrors(errorBody.fieldErrors);
}
var message = (errorBody && errorBody.message) ? errorBody.message : ('Save failed with status ' + res.status);
throw new Error(message);
}
var savedItem = await res.json();
await handleImageUploadIfNeeded(activeSection, savedItem);

// Capture what we need before closeModal() clears activeSection/activeItem -
// calling loadSection(activeSection) or checking activeItem AFTER closeModal()
// was the bug that made saves (especially an image upload) look like they'd
// silently done nothing: closeModal() had already nulled activeSection out,
// so the reload threw immediately - and since the modal was already closed by
// then, that error had nowhere visible to show either.
var completedSection = activeSection;
var wasEdit = !!activeItem;

closeModal();
showToast(completedSection.singular.charAt(0).toUpperCase() + completedSection.singular.slice(1) +
(wasEdit ? ' updated.' : ' created.'));
loadSection(completedSection);

// Company info drives this very page's own header/title/footer (and every
// other admin page's, on their next load) - without this, editing it here
// would only update the table row, leaving the stale old name showing right
// above it until a manual refresh.
if(completedSection.key === 'company-info'){
refreshBranding();
}
}catch(err){
modalError.textContent = err.message;
}finally{
modalSaveBtn.disabled = false;
modalSaveBtn.textContent = 'Save';
}
});

async function deleteItem(section, id, btn){
if(!confirm('Delete this ' + section.singular + '? This can\'t be undone.')) return;
btn.disabled = true;
btn.textContent = 'Deleting…';
try{
var res = await fetch(section.path + '/' + id, {method:'DELETE', credentials:'same-origin', headers: csrfHeaders()});
if(!res.ok && res.status !== 204){
throw new Error('Delete failed with status ' + res.status);
}
loadSection(section);
showToast(section.singular.charAt(0).toUpperCase() + section.singular.slice(1) + ' deleted.');
}catch(err){
showToast('Couldn\'t delete: ' + err.message, true);
btn.disabled = false;
btn.textContent = 'Delete';
}
}

async function logout(){
try{
await fetch('/admin/logout', {method:'POST', credentials:'same-origin', headers: csrfHeaders()});
}catch(err){
// Falls through to the redirect below either way.
}
window.location.href = '/admin/login?logout';
}

document.getElementById('logout-btn').addEventListener('click', logout);

SECTIONS.forEach(loadSection);

function setupMobileNav(){
var toggle = document.getElementById('nav-toggle');
var actions = document.getElementById('header-actions');
var backdrop = document.getElementById('nav-backdrop');
if(!toggle || !actions || !backdrop) return;

function closeNav(){
actions.classList.remove('open');
backdrop.classList.remove('open');
toggle.classList.remove('active');
toggle.setAttribute('aria-expanded', 'false');
document.body.classList.remove('nav-open-lock');
}

function openNav(){
actions.classList.add('open');
backdrop.classList.add('open');
toggle.classList.add('active');
toggle.setAttribute('aria-expanded', 'true');
document.body.classList.add('nav-open-lock');
}

toggle.addEventListener('click', function(){
if(actions.classList.contains('open')){
closeNav();
}else{
openNav();
}
});

backdrop.addEventListener('click', closeNav);

actions.querySelectorAll('a,button').forEach(function(el){
el.addEventListener('click', closeNav);
});

window.addEventListener('resize', function(){
if(window.innerWidth > 768){
closeNav();
}
});
}

setupMobileNav();
</script>

</body>
</html>
