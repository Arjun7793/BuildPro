<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildPro Admin - Leads</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f7f7f7;
color:#333;
}

header{
background:#222;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:700;
color:#ffb400;
}

.logo span{
color:white;
font-weight:400;
font-size:16px;
margin-left:10px;
}

main{
padding:50px 8%;
}

.title{
font-size:32px;
color:#222;
margin-bottom:10px;
}

.subtitle{
color:#777;
margin-bottom:30px;
}

.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:16px;
}

.filters{
display:flex;
flex-wrap:wrap;
align-items:flex-end;
gap:12px;
margin-bottom:20px;
}

.filter-field{
display:flex;
flex-direction:column;
gap:4px;
}

.filter-field label{
font-size:12px;
color:#888;
text-transform:uppercase;
letter-spacing:.5px;
}

.filter-field input{
padding:9px 12px;
border:1px solid #ddd;
border-radius:5px;
font-family:'Poppins',sans-serif;
font-size:14px;
min-width:160px;
}

.filter-field input:focus{
outline:none;
border-color:#ffb400;
}

.count{
color:#555;
font-weight:500;
}

.btn{
padding:10px 22px;
background:#ffb400;
color:#222;
font-weight:bold;
border:none;
border-radius:5px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#222;
color:#ffb400;
}

.btn:disabled{
opacity:.5;
cursor:default;
background:#ffb400;
color:#222;
}

.btn-secondary{
background:none;
border:1px solid #ccc;
color:#555;
}

.btn-secondary:hover{
background:#eee;
color:#333;
}

.header-actions{
display:flex;
align-items:center;
gap:20px;
}

.nav-link{
color:#ccc;
text-decoration:none;
font-size:14px;
font-weight:500;
transition:.3s;
background:none;
border:none;
cursor:pointer;
font-family:'Poppins',sans-serif;
}

.nav-link:hover{
color:#ffb400;
}

.card{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

thead th{
text-align:left;
background:#222;
color:#ffb400;
padding:16px 20px;
font-weight:600;
font-size:14px;
text-transform:uppercase;
letter-spacing:.5px;
}

tbody td{
padding:16px 20px;
border-bottom:1px solid #eee;
vertical-align:top;
font-size:15px;
}

tbody tr:last-child td{
border-bottom:none;
}

tbody tr:hover{
background:#fafafa;
}

.msg-cell{
max-width:320px;
white-space:pre-wrap;
color:#555;
}

.date-cell{
color:#888;
white-space:nowrap;
font-size:13px;
}

.delete-btn{
background:none;
border:1px solid #d9534f;
color:#d9534f;
padding:6px 14px;
border-radius:5px;
cursor:pointer;
font-size:13px;
font-weight:600;
transition:.3s;
}

.delete-btn:hover{
background:#d9534f;
color:white;
}

.empty-state,.error-state,.loading-state{
padding:60px 20px;
text-align:center;
color:#888;
}

.error-state{
color:#d9534f;
}

.pagination{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
padding:20px;
border-top:1px solid #eee;
font-size:14px;
color:#666;
}

.pagination button{
padding:8px 16px;
font-size:13px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:24px;
margin-top:60px;
font-size:14px;
}

@media(max-width:768px){
main{padding:30px 5%;}
.msg-cell{max-width:180px;}
table,thead,tbody,th,td,tr{display:block;}
thead{display:none;}
tbody tr{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:16px;
padding:16px;
}
tbody td{
border-bottom:none;
padding:6px 0;
}
tbody td::before{
content:attr(data-label);
display:block;
font-size:11px;
text-transform:uppercase;
color:#aaa;
margin-bottom:2px;
}
.card{background:none;box-shadow:none;}
}

</style>
</head>
<body>

<header>
<div class="logo">BuildPro<span>Admin &middot; Leads</span></div>
<div class="header-actions">
<a class="nav-link" href="/admin">&larr; Dashboard</a>
<a class="nav-link" href="/admin/content">Manage site content &rarr;</a>
<button class="nav-link" id="logout-btn" type="button">Log out</button>
<button class="btn" id="refresh-btn">Refresh</button>
</div>
</header>

<main>
<div class="title">Contact form submissions</div>
<div class="subtitle">Every lead captured through the public site's contact form, newest first.</div>

<div class="filters">
<div class="filter-field">
<label for="filter-name">Name</label>
<input type="text" id="filter-name" placeholder="Search by name&hellip;">
</div>
<div class="filter-field">
<label for="filter-from">From</label>
<input type="date" id="filter-from">
</div>
<div class="filter-field">
<label for="filter-to">To</label>
<input type="date" id="filter-to">
</div>
<button class="btn btn-secondary" id="clear-filters-btn" type="button">Clear filters</button>
</div>

<div class="toolbar">
<div class="count" id="count-label">Loading&hellip;</div>
</div>

<div class="card">
<div id="content">
<div class="loading-state">Loading leads&hellip;</div>
</div>
<div class="pagination" id="pagination" hidden></div>
</div>
</main>

<footer>&copy; <span id="year"></span> BuildPro Construction &mdash; Admin area</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

var content = document.getElementById('content');
var countLabel = document.getElementById('count-label');
var refreshBtn = document.getElementById('refresh-btn');
var logoutBtn = document.getElementById('logout-btn');
var paginationEl = document.getElementById('pagination');
var nameFilterEl = document.getElementById('filter-name');
var fromFilterEl = document.getElementById('filter-from');
var toFilterEl = document.getElementById('filter-to');
var clearFiltersBtn = document.getElementById('clear-filters-btn');

var currentPage = 0;
var pageSize = 20;
var nameFilterTimer = null;

function escapeHtml(str){
if(str === null || str === undefined) return '';
return String(str)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;');
}

// The CSRF token Spring Security issues via a readable cookie (see
// config/CsrfCookieFilter.java) - sent back as a header on every write, the
// standard pattern for a JS-driven admin page using session/cookie login
// instead of a server-rendered form.
function getCookie(name){
var match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
return match ? decodeURIComponent(match[1]) : '';
}

function csrfHeaders(){
return {'X-XSRF-TOKEN': getCookie('XSRF-TOKEN')};
}

// Fetched once at load from /api/config (backed by app.display-timezone in
// application.yaml, DISPLAY_TIMEZONE env var) - not hardcoded here, so changing
// the configured zone doesn't need a code/page change.
var displayTimezone = 'UTC';

async function loadConfig(){
try{
var res = await fetch('/api/config', {credentials:'same-origin'});
if(res.ok){
var config = await res.json();
if(config.displayTimezone) displayTimezone = config.displayTimezone;
}
}catch(err){
// Falls back to UTC below if this fails - not fatal, just less friendly.
}
}

function formatDate(iso){
if(!iso) return '';
// The backend sends a naive LocalDateTime (no timezone offset, e.g.
// "2026-09-20T04:45:00") captured with the server clock, which runs in UTC on
// Railway. A string with no offset is parsed by the browser as LOCAL time, which
// would silently show the wrong hour - so treat it as UTC explicitly, then format
// in the configured display timezone regardless of the viewer's own timezone.
var hasOffset = /[Zz]|[+-]\d\d:\d\d$/.test(iso);
var d = new Date(hasOffset ? iso : iso + 'Z');
if(isNaN(d.getTime())) return iso;
var formatted = d.toLocaleString('en-IN', {timeZone: displayTimezone, year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:true});
var abbrev = new Intl.DateTimeFormat('en-US', {timeZone: displayTimezone, timeZoneName:'short'}).formatToParts(d).find(function(p){return p.type === 'timeZoneName';});
return formatted + (abbrev ? ' ' + abbrev.value : '');
}

function buildQuery(){
var params = new URLSearchParams();
params.set('page', currentPage);
params.set('size', pageSize);
var name = nameFilterEl.value.trim();
if(name) params.set('name', name);
if(fromFilterEl.value) params.set('from', fromFilterEl.value);
if(toFilterEl.value) params.set('to', toFilterEl.value);
return params.toString();
}

async function loadLeads(page){
currentPage = page || 0;
countLabel.textContent = 'Loading…';
content.innerHTML = '<div class="loading-state">Loading leads&hellip;</div>';
paginationEl.hidden = true;
try{
var res = await fetch('/api/leads?' + buildQuery(), {credentials:'same-origin'});
if(res.status === 401){
content.innerHTML = '<div class="error-state">Not signed in as admin. <a href="/admin/login">Sign in</a> to continue.</div>';
countLabel.textContent = '';
return;
}
if(!res.ok){
throw new Error('Request failed with status ' + res.status);
}
var data = await res.json();
// Spring Data's Page<T> JSON shape has changed across versions - modern Spring
// Boot nests page metadata under a "page" object ({content, page: {size,
// number, totalElements, totalPages}}), older versions put those fields
// directly on the root object alongside "content". Handled defensively so
// this keeps working across a Spring Boot upgrade either way.
var leads = Array.isArray(data) ? data : (data.content || []);
var meta = data.page || data;
var pageInfo = {
size: meta.size !== undefined ? meta.size : pageSize,
number: meta.number !== undefined ? meta.number : currentPage,
totalElements: meta.totalElements !== undefined ? meta.totalElements : leads.length,
totalPages: meta.totalPages !== undefined ? meta.totalPages : 1
};
renderLeads(leads, pageInfo);
}catch(err){
content.innerHTML = '<div class="error-state">Couldn\'t load leads: ' + escapeHtml(err.message) + '</div>';
countLabel.textContent = '';
}
}

function renderLeads(leads, pageInfo){
countLabel.textContent = pageInfo.totalElements + (pageInfo.totalElements === 1 ? ' lead' : ' leads') +
(pageInfo.totalPages > 1 ? ' \u00b7 page ' + (pageInfo.number + 1) + ' of ' + pageInfo.totalPages : '');

if(leads.length === 0){
var hasFilters = nameFilterEl.value.trim() || fromFilterEl.value || toFilterEl.value;
content.innerHTML = '<div class="empty-state">' +
(hasFilters ? 'No leads match these filters.' :
(currentPage > 0 ? 'No more leads on this page.' : 'No leads yet. Submissions from the contact form will show up here.')) +
'</div>';
renderPagination(pageInfo);
return;
}

var rows = leads.map(function(lead){
var email = lead.email ? '<a href="mailto:' + escapeHtml(lead.email) + '">' + escapeHtml(lead.email) + '</a>' : '&mdash;';
var phone = lead.phone ? escapeHtml(lead.phone) : '&mdash;';
var message = lead.message ? escapeHtml(lead.message) : '&mdash;';
return '<tr data-id="' + lead.id + '">' +
'<td data-label="Name">' + escapeHtml(lead.name) + '</td>' +
'<td data-label="Email">' + email + '</td>' +
'<td data-label="Phone">' + phone + '</td>' +
'<td data-label="Message" class="msg-cell">' + message + '</td>' +
'<td data-label="Submitted" class="date-cell">' + formatDate(lead.createdAt) + '</td>' +
'<td data-label="Action"><button class="delete-btn" data-id="' + lead.id + '">Delete</button></td>' +
'</tr>';
}).join('');

content.innerHTML = '<table>' +
'<thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Submitted</th><th></th></tr></thead>' +
'<tbody>' + rows + '</tbody>' +
'</table>';

content.querySelectorAll('.delete-btn').forEach(function(btn){
btn.addEventListener('click', function(){
var id = btn.getAttribute('data-id');
deleteLead(id, btn);
});
});

renderPagination(pageInfo);
}

function renderPagination(pageInfo){
if(pageInfo.totalPages <= 1){
paginationEl.hidden = true;
return;
}
paginationEl.hidden = false;
paginationEl.innerHTML =
'<button class="btn btn-secondary" id="prev-page"' + (pageInfo.number <= 0 ? ' disabled' : '') + '>&larr; Prev</button>' +
'<span>Page ' + (pageInfo.number + 1) + ' of ' + pageInfo.totalPages + '</span>' +
'<button class="btn btn-secondary" id="next-page"' + (pageInfo.number >= pageInfo.totalPages - 1 ? ' disabled' : '') + '>Next &rarr;</button>';

var prevBtn = document.getElementById('prev-page');
var nextBtn = document.getElementById('next-page');
if(prevBtn && !prevBtn.disabled) prevBtn.addEventListener('click', function(){ loadLeads(pageInfo.number - 1); });
if(nextBtn && !nextBtn.disabled) nextBtn.addEventListener('click', function(){ loadLeads(pageInfo.number + 1); });
}

async function deleteLead(id, btn){
if(!confirm('Delete this lead? This can\'t be undone.')) return;
btn.disabled = true;
btn.textContent = 'Deleting…';
try{
var res = await fetch('/api/leads/' + id, {method:'DELETE', credentials:'same-origin', headers: csrfHeaders()});
if(!res.ok && res.status !== 204){
throw new Error('Delete failed with status ' + res.status);
}
loadLeads(currentPage);
}catch(err){
alert('Couldn\'t delete lead: ' + err.message);
btn.disabled = false;
btn.textContent = 'Delete';
}
}

async function logout(){
try{
await fetch('/admin/logout', {method:'POST', credentials:'same-origin', headers: csrfHeaders()});
}catch(err){
// Falls through to the redirect below either way - worst case the session
// is still valid and the login page just asks again.
}
window.location.href = '/admin/login?logout';
}

refreshBtn.addEventListener('click', function(){ loadLeads(currentPage); });
logoutBtn.addEventListener('click', logout);

// Debounced so typing a name doesn't fire a request per keystroke; date inputs
// filter immediately since they change far less often. Any filter change resets
// to page 0 - staying on, say, page 3 of a now-much-smaller filtered result
// would just show an empty page.
nameFilterEl.addEventListener('input', function(){
clearTimeout(nameFilterTimer);
nameFilterTimer = setTimeout(function(){ loadLeads(0); }, 350);
});
fromFilterEl.addEventListener('change', function(){ loadLeads(0); });
toFilterEl.addEventListener('change', function(){ loadLeads(0); });
clearFiltersBtn.addEventListener('click', function(){
nameFilterEl.value = '';
fromFilterEl.value = '';
toFilterEl.value = '';
loadLeads(0);
});

loadConfig().then(function(){ loadLeads(0); });
</script>

</body>
</html>
