<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildPro Admin - Leads</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{
overflow-x:hidden;
}

body{
background:#f7f7f7;
color:#333;
}

header{
background:#222;
padding:12px 5%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:700;
color:#ffb400;
display:flex;
align-items:center;
flex-wrap:wrap;
row-gap:2px;
min-width:0;
overflow:hidden;
}

.logo span{
color:white;
font-weight:400;
font-size:16px;
margin-left:10px;
}

.logo #brand-name{
color:#ffb400;
font-weight:700;
font-size:26px;
margin-left:0;
}

main{
padding:30px 5%;
}

.title{
font-size:32px;
color:#222;
margin-bottom:10px;
}

.subtitle{
color:#777;
margin-bottom:30px;
}

.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:16px;
}

.filters{
display:flex;
flex-wrap:wrap;
align-items:flex-end;
gap:12px;
margin-bottom:20px;
}

.filter-field{
display:flex;
flex-direction:column;
gap:4px;
width:100%;
}

.filter-field label{
font-size:12px;
color:#888;
text-transform:uppercase;
letter-spacing:.5px;
}

.filter-field input{
padding:9px 12px;
border:1px solid #ddd;
border-radius:5px;
font-family:'Poppins',sans-serif;
font-size:14px;
width:100%;
}

.filter-field input:focus{
outline:none;
border-color:#ffb400;
}

.count{
color:#555;
font-weight:500;
}

.btn{
padding:10px 22px;
background:#ffb400;
color:#222;
font-weight:bold;
border:none;
border-radius:5px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#222;
color:#ffb400;
}

.btn:disabled{
opacity:.5;
cursor:default;
background:#ffb400;
color:#222;
}

.btn-secondary{
background:none;
border:1px solid #ccc;
color:#555;
}

.btn-secondary:hover{
background:#eee;
color:#333;
}

.header-actions{
display:flex;
flex-direction:column;
align-items:flex-start;
gap:6px;
position:fixed;
top:0;
right:0;
height:100vh;
width:min(78%,300px);
background:#222;
padding:90px 30px 30px;
box-shadow:-10px 0 30px rgba(0,0,0,.3);
transform:translateX(100%);
transition:transform .3s ease;
z-index:1000;
}

.header-actions.open{
transform:translateX(0);
}

.header-actions .nav-link,.header-actions .btn{
width:100%;
text-align:left;
}

.header-actions .nav-link{
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,.12);
}

.nav-backdrop{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:999;
}

.nav-backdrop.open{
display:block;
}

body.nav-open-lock{
overflow:hidden;
}

/* Hamburger button - visible by default (mobile-first); hidden at
   min-width:769px where .header-actions becomes the normal inline row. */
.nav-toggle{
display:flex;
flex-direction:column;
justify-content:space-between;
width:24px;
height:18px;
background:none;
border:none;
padding:0;
cursor:pointer;
z-index:1002;
flex-shrink:0;
}

.nav-toggle span{
display:block;
height:3px;
width:100%;
background:#fff;
border-radius:2px;
transition:.3s;
}

.nav-toggle.active span:nth-child(1){
transform:translateY(7.5px) rotate(45deg);
}

.nav-toggle.active span:nth-child(2){
opacity:0;
}

.nav-toggle.active span:nth-child(3){
transform:translateY(-7.5px) rotate(-45deg);
}


.nav-link{
color:#ccc;
text-decoration:none;
font-size:14px;
font-weight:500;
transition:.3s;
background:none;
border:none;
cursor:pointer;
font-family:'Poppins',sans-serif;
}

.nav-link:hover{
color:#ffb400;
}

.card{
background:none;
box-shadow:none;
}

table{
width:100%;
border-collapse:collapse;
}

thead th{
text-align:left;
background:#222;
color:#ffb400;
padding:16px 20px;
font-weight:600;
font-size:14px;
text-transform:uppercase;
letter-spacing:.5px;
}

table,thead,tbody,th,td,tr{display:block;}
thead{display:none;}
tbody tr{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:16px;
padding:16px;
}
tbody td{
border-bottom:none;
padding:6px 0;
vertical-align:top;
font-size:15px;
}
tbody td::before{
content:attr(data-label);
display:block;
font-size:11px;
text-transform:uppercase;
color:#aaa;
margin-bottom:2px;
}

.msg-cell{
max-width:180px;
white-space:pre-wrap;
color:#555;
}

.date-cell{
color:#888;
white-space:nowrap;
font-size:13px;
}

.delete-btn{
background:none;
border:1px solid #d9534f;
color:#d9534f;
padding:6px 14px;
border-radius:5px;
cursor:pointer;
font-size:13px;
font-weight:600;
transition:.3s;
}

.delete-btn:hover{
background:#d9534f;
color:white;
}

.empty-state,.error-state,.loading-state{
padding:60px 20px;
text-align:center;
color:#888;
}

.error-state{
color:#d9534f;
}

.pagination{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
padding:20px;
border-top:1px solid #eee;
font-size:14px;
color:#666;
}

.pagination button{
padding:8px 16px;
font-size:13px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:24px;
margin-top:60px;
font-size:14px;
}

@media(min-width:769px){
header{padding:18px 8%;}
main{padding:50px 8%;}

.nav-toggle{
display:none;
}

.header-actions{
position:static;
height:auto;
width:auto;
background:none;
flex-direction:row;
align-items:center;
gap:20px;
padding:0;
box-shadow:none;
transform:none;
}

.header-actions .nav-link,.header-actions .btn{
width:auto;
text-align:left;
}

.header-actions .nav-link{
padding:0;
border-bottom:none;
}

.card{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
overflow:hidden;
}

table,thead,tbody,th,td,tr{display:revert;}
thead{display:table-header-group;}
tbody tr{
background:none;
border-radius:0;
box-shadow:none;
margin-bottom:0;
padding:0;
}
tbody tr:last-child td{
border-bottom:none;
}
tbody tr:hover{
background:#fafafa;
}
tbody td{
padding:16px 20px;
border-bottom:1px solid #eee;
}
tbody td::before{
display:none;
}

.msg-cell{max-width:320px;}

.filter-field{
width:auto;
}

.filter-field input{
width:auto;
min-width:160px;
}
}

</style>
</head>
<body>

<header>
<div class="logo"><span id="brand-name">BuildPro</span><span>Admin &middot; Leads</span></div>
<button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="header-actions">
<span></span>
<span></span>
<span></span>
</button>
<div class="header-actions" id="header-actions">
<a class="nav-link" href="/admin">&larr; Dashboard</a>
<a class="nav-link" href="/admin/content">Manage site content &rarr;</a>
<button class="nav-link" id="logout-btn" type="button">Log out</button>
<button class="btn" id="refresh-btn">Refresh</button>
</div>
</header>

<div class="nav-backdrop" id="nav-backdrop"></div>

<main>
<div class="title">Contact form submissions</div>
<div class="subtitle">Every lead captured through the public site's contact form, newest first.</div>

<form class="filters" id="filters-form">
<div class="filter-field">
<label for="filter-name">Name</label>
<input type="text" id="filter-name" placeholder="Search by name&hellip;">
</div>
<div class="filter-field">
<label for="filter-from">From</label>
<input type="date" id="filter-from">
</div>
<div class="filter-field">
<label for="filter-to">To</label>
<input type="date" id="filter-to">
</div>
<button class="btn" type="submit">Search</button>
<button class="btn btn-secondary" id="clear-filters-btn" type="button">Clear filters</button>
</form>

<div class="toolbar">
<div class="count" id="count-label">Loading&hellip;</div>
</div>

<div class="card">
<div id="content">
<div class="loading-state">Loading leads&hellip;</div>
</div>
<div class="pagination" id="pagination" hidden></div>
</div>
</main>

<footer>&copy; <span id="year"></span> <span id="brand-name-footer">BuildPro Construction</span> &mdash; Admin area</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// Same wiring as the public site: the admin pages also hardcoded "BuildPro"
// in the title/logo/footer with no way to change it. Company name (set in
// /admin/content -> Company info) now drives all of them here too, fetched
// from the same public GET /api/company-info the public site uses - no admin
// session needed, so this works on the login page as well. Falls back to the
// "BuildPro" text already in the page if the request fails or nothing's been
// configured yet.
(function(){
fetch('/api/company-info', {credentials:'same-origin'}).then(function(res){
return res.ok ? res.json() : [];
}).then(function(records){
var name = (records && records[0] && records[0].companyName || '').trim();
if(!name) return;
document.title = document.title.replace(/^BuildPro\b/, name);
var brandEl = document.getElementById('brand-name');
if(brandEl) brandEl.textContent = name;
var brandFooterEl = document.getElementById('brand-name-footer');
if(brandFooterEl) brandFooterEl.textContent = name;
}).catch(function(){
// Keep the "BuildPro" fallback already in the page.
});
})();


var content = document.getElementById('content');
var countLabel = document.getElementById('count-label');
var refreshBtn = document.getElementById('refresh-btn');
var logoutBtn = document.getElementById('logout-btn');
var paginationEl = document.getElementById('pagination');
var filtersForm = document.getElementById('filters-form');
var nameFilterEl = document.getElementById('filter-name');
var fromFilterEl = document.getElementById('filter-from');
var toFilterEl = document.getElementById('filter-to');
var clearFiltersBtn = document.getElementById('clear-filters-btn');

var currentPage = 0;
var pageSize = 20;

function escapeHtml(str){
if(str === null || str === undefined) return '';
return String(str)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;');
}

// The CSRF token Spring Security issues via a readable cookie (see
// config/CsrfCookieFilter.java) - sent back as a header on every write, the
// standard pattern for a JS-driven admin page using session/cookie login
// instead of a server-rendered form.
function getCookie(name){
var match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
return match ? decodeURIComponent(match[1]) : '';
}

function csrfHeaders(){
return {'X-XSRF-TOKEN': getCookie('XSRF-TOKEN')};
}

// Fetched once at load from /api/config (backed by app.display-timezone in
// application.yaml, DISPLAY_TIMEZONE env var) - not hardcoded here, so changing
// the configured zone doesn't need a code/page change.
var displayTimezone = 'UTC';

async function loadConfig(){
try{
var res = await fetch('/api/config', {credentials:'same-origin'});
if(res.ok){
var config = await res.json();
if(config.displayTimezone) displayTimezone = config.displayTimezone;
}
}catch(err){
// Falls back to UTC below if this fails - not fatal, just less friendly.
}
}

function formatDate(iso){
if(!iso) return '';
// The backend sends a naive LocalDateTime (no timezone offset, e.g.
// "2026-09-20T04:45:00") captured with the server clock, which runs in UTC on
// Railway. A string with no offset is parsed by the browser as LOCAL time, which
// would silently show the wrong hour - so treat it as UTC explicitly, then format
// in the configured display timezone regardless of the viewer's own timezone.
var hasOffset = /[Zz]|[+-]\d\d:\d\d$/.test(iso);
var d = new Date(hasOffset ? iso : iso + 'Z');
if(isNaN(d.getTime())) return iso;
var formatted = d.toLocaleString('en-IN', {timeZone: displayTimezone, year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:true});
var abbrev = new Intl.DateTimeFormat('en-US', {timeZone: displayTimezone, timeZoneName:'short'}).formatToParts(d).find(function(p){return p.type === 'timeZoneName';});
return formatted + (abbrev ? ' ' + abbrev.value : '');
}

function buildQuery(){
var params = new URLSearchParams();
params.set('page', currentPage);
params.set('size', pageSize);
var name = nameFilterEl.value.trim();
if(name) params.set('name', name);
if(fromFilterEl.value) params.set('from', fromFilterEl.value);
if(toFilterEl.value) params.set('to', toFilterEl.value);
return params.toString();
}

async function loadLeads(page){
currentPage = page || 0;
countLabel.textContent = 'Loading…';
content.innerHTML = '<div class="loading-state">Loading leads&hellip;</div>';
paginationEl.hidden = true;
try{
var res = await fetch('/api/leads?' + buildQuery(), {credentials:'same-origin'});
if(res.status === 401){
content.innerHTML = '<div class="error-state">Not signed in as admin. <a href="/admin/login">Sign in</a> to continue.</div>';
countLabel.textContent = '';
return;
}
if(!res.ok){
throw new Error('Request failed with status ' + res.status);
}
var data = await res.json();
// Spring Data's Page<T> JSON shape has changed across versions - modern Spring
// Boot nests page metadata under a "page" object ({content, page: {size,
// number, totalElements, totalPages}}), older versions put those fields
// directly on the root object alongside "content". Handled defensively so
// this keeps working across a Spring Boot upgrade either way.
var leads = Array.isArray(data) ? data : (data.content || []);
var meta = data.page || data;
var pageInfo = {
size: meta.size !== undefined ? meta.size : pageSize,
number: meta.number !== undefined ? meta.number : currentPage,
totalElements: meta.totalElements !== undefined ? meta.totalElements : leads.length,
totalPages: meta.totalPages !== undefined ? meta.totalPages : 1
};
renderLeads(leads, pageInfo);
}catch(err){
content.innerHTML = '<div class="error-state">Couldn\'t load leads: ' + escapeHtml(err.message) + '</div>';
countLabel.textContent = '';
}
}

function renderLeads(leads, pageInfo){
countLabel.textContent = pageInfo.totalElements + (pageInfo.totalElements === 1 ? ' lead' : ' leads') +
(pageInfo.totalPages > 1 ? ' \u00b7 page ' + (pageInfo.number + 1) + ' of ' + pageInfo.totalPages : '');

if(leads.length === 0){
var hasFilters = nameFilterEl.value.trim() || fromFilterEl.value || toFilterEl.value;
content.innerHTML = '<div class="empty-state">' +
(hasFilters ? 'No leads match these filters.' :
(currentPage > 0 ? 'No more leads on this page.' : 'No leads yet. Submissions from the contact form will show up here.')) +
'</div>';
renderPagination(pageInfo);
return;
}

var rows = leads.map(function(lead){
var email = lead.email ? '<a href="mailto:' + escapeHtml(lead.email) + '">' + escapeHtml(lead.email) + '</a>' : '&mdash;';
var phone = lead.phone ? escapeHtml(lead.phone) : '&mdash;';
var message = lead.message ? escapeHtml(lead.message) : '&mdash;';
return '<tr data-id="' + lead.id + '">' +
'<td data-label="Name">' + escapeHtml(lead.name) + '</td>' +
'<td data-label="Email">' + email + '</td>' +
'<td data-label="Phone">' + phone + '</td>' +
'<td data-label="Message" class="msg-cell">' + message + '</td>' +
'<td data-label="Submitted" class="date-cell">' + formatDate(lead.createdAt) + '</td>' +
'<td data-label="Action"><button class="delete-btn" data-id="' + lead.id + '">Delete</button></td>' +
'</tr>';
}).join('');

content.innerHTML = '<table>' +
'<thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Submitted</th><th></th></tr></thead>' +
'<tbody>' + rows + '</tbody>' +
'</table>';

content.querySelectorAll('.delete-btn').forEach(function(btn){
btn.addEventListener('click', function(){
var id = btn.getAttribute('data-id');
deleteLead(id, btn);
});
});

renderPagination(pageInfo);
}

function renderPagination(pageInfo){
if(pageInfo.totalPages <= 1){
paginationEl.hidden = true;
return;
}
paginationEl.hidden = false;
paginationEl.innerHTML =
'<button class="btn btn-secondary" id="prev-page"' + (pageInfo.number <= 0 ? ' disabled' : '') + '>&larr; Prev</button>' +
'<span>Page ' + (pageInfo.number + 1) + ' of ' + pageInfo.totalPages + '</span>' +
'<button class="btn btn-secondary" id="next-page"' + (pageInfo.number >= pageInfo.totalPages - 1 ? ' disabled' : '') + '>Next &rarr;</button>';

var prevBtn = document.getElementById('prev-page');
var nextBtn = document.getElementById('next-page');
if(prevBtn && !prevBtn.disabled) prevBtn.addEventListener('click', function(){ loadLeads(pageInfo.number - 1); });
if(nextBtn && !nextBtn.disabled) nextBtn.addEventListener('click', function(){ loadLeads(pageInfo.number + 1); });
}

async function deleteLead(id, btn){
if(!confirm('Delete this lead? This can\'t be undone.')) return;
btn.disabled = true;
btn.textContent = 'Deleting…';
try{
var res = await fetch('/api/leads/' + id, {method:'DELETE', credentials:'same-origin', headers: csrfHeaders()});
if(!res.ok && res.status !== 204){
throw new Error('Delete failed with status ' + res.status);
}
loadLeads(currentPage);
}catch(err){
alert('Couldn\'t delete lead: ' + err.message);
btn.disabled = false;
btn.textContent = 'Delete';
}
}

async function logout(){
try{
await fetch('/admin/logout', {method:'POST', credentials:'same-origin', headers: csrfHeaders()});
}catch(err){
// Falls through to the redirect below either way - worst case the session
// is still valid and the login page just asks again.
}
window.location.href = '/admin/login?logout';
}

refreshBtn.addEventListener('click', function(){ loadLeads(currentPage); });
logoutBtn.addEventListener('click', logout);

// Filters only apply when the admin explicitly asks for them - the Search
// button, or Enter in any of the fields (free with a <form>/submit button
// instead of a plain button + click handler) - rather than firing a request on
// every keystroke or every date change. Resets to page 0, since staying on,
// say, page 3 of a now-much-smaller filtered result would just show an empty
// page.
filtersForm.addEventListener('submit', function(e){
e.preventDefault();
loadLeads(0);
});
clearFiltersBtn.addEventListener('click', function(){
nameFilterEl.value = '';
fromFilterEl.value = '';
toFilterEl.value = '';
loadLeads(0);
});

loadConfig().then(function(){ loadLeads(0); });

function setupMobileNav(){
var toggle = document.getElementById('nav-toggle');
var actions = document.getElementById('header-actions');
var backdrop = document.getElementById('nav-backdrop');
if(!toggle || !actions || !backdrop) return;

function closeNav(){
actions.classList.remove('open');
backdrop.classList.remove('open');
toggle.classList.remove('active');
toggle.setAttribute('aria-expanded', 'false');
document.body.classList.remove('nav-open-lock');
}

function openNav(){
actions.classList.add('open');
backdrop.classList.add('open');
toggle.classList.add('active');
toggle.setAttribute('aria-expanded', 'true');
document.body.classList.add('nav-open-lock');
}

toggle.addEventListener('click', function(){
if(actions.classList.contains('open')){
closeNav();
}else{
openNav();
}
});

backdrop.addEventListener('click', closeNav);

actions.querySelectorAll('a,button').forEach(function(el){
el.addEventListener('click', closeNav);
});

window.addEventListener('resize', function(){
if(window.innerWidth > 768){
closeNav();
}
});
}

setupMobileNav();
</script>

</body>
</html>
