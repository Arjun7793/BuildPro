<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildPro Admin - Leads</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f7f7f7;
color:#333;
}

header{
background:#222;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:700;
color:#ffb400;
}

.logo span{
color:white;
font-weight:400;
font-size:16px;
margin-left:10px;
}

main{
padding:50px 8%;
}

.title{
font-size:32px;
color:#222;
margin-bottom:10px;
}

.subtitle{
color:#777;
margin-bottom:30px;
}

.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.count{
color:#555;
font-weight:500;
}

.btn{
padding:10px 22px;
background:#ffb400;
color:#222;
font-weight:bold;
border:none;
border-radius:5px;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#222;
color:#ffb400;
}

.card{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

thead th{
text-align:left;
background:#222;
color:#ffb400;
padding:16px 20px;
font-weight:600;
font-size:14px;
text-transform:uppercase;
letter-spacing:.5px;
}

tbody td{
padding:16px 20px;
border-bottom:1px solid #eee;
vertical-align:top;
font-size:15px;
}

tbody tr:last-child td{
border-bottom:none;
}

tbody tr:hover{
background:#fafafa;
}

.msg-cell{
max-width:320px;
white-space:pre-wrap;
color:#555;
}

.date-cell{
color:#888;
white-space:nowrap;
font-size:13px;
}

.delete-btn{
background:none;
border:1px solid #d9534f;
color:#d9534f;
padding:6px 14px;
border-radius:5px;
cursor:pointer;
font-size:13px;
font-weight:600;
transition:.3s;
}

.delete-btn:hover{
background:#d9534f;
color:white;
}

.empty-state,.error-state,.loading-state{
padding:60px 20px;
text-align:center;
color:#888;
}

.error-state{
color:#d9534f;
}

footer{
background:#111;
color:white;
text-align:center;
padding:24px;
margin-top:60px;
font-size:14px;
}

@media(max-width:768px){
main{padding:30px 5%;}
.msg-cell{max-width:180px;}
table,thead,tbody,th,td,tr{display:block;}
thead{display:none;}
tbody tr{
background:white;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:16px;
padding:16px;
}
tbody td{
border-bottom:none;
padding:6px 0;
}
tbody td::before{
content:attr(data-label);
display:block;
font-size:11px;
text-transform:uppercase;
color:#aaa;
margin-bottom:2px;
}
.card{background:none;box-shadow:none;}
}

</style>
</head>
<body>

<header>
<div class="logo">BuildPro<span>Admin &middot; Leads</span></div>
<button class="btn" id="refresh-btn">Refresh</button>
</header>

<main>
<div class="title">Contact form submissions</div>
<div class="subtitle">Every lead captured through the public site's contact form, newest first.</div>

<div class="toolbar">
<div class="count" id="count-label">Loading&hellip;</div>
</div>

<div class="card">
<div id="content">
<div class="loading-state">Loading leads&hellip;</div>
</div>
</div>
</main>

<footer>&copy; <span id="year"></span> BuildPro Construction &mdash; Admin area</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

var content = document.getElementById('content');
var countLabel = document.getElementById('count-label');
var refreshBtn = document.getElementById('refresh-btn');

function escapeHtml(str){
if(str === null || str === undefined) return '';
return String(str)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;');
}

function formatDate(iso){
if(!iso) return '';
var d = new Date(iso);
if(isNaN(d.getTime())) return iso;
return d.toLocaleString(undefined, {year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

async function loadLeads(){
countLabel.textContent = 'Loading…';
content.innerHTML = '<div class="loading-state">Loading leads&hellip;</div>';
try{
var res = await fetch('/api/leads', {credentials:'same-origin'});
if(res.status === 401){
content.innerHTML = '<div class="error-state">Not signed in as admin. Reload the page and enter the admin credentials when prompted.</div>';
countLabel.textContent = '';
return;
}
if(!res.ok){
throw new Error('Request failed with status ' + res.status);
}
var leads = await res.json();
renderLeads(leads);
}catch(err){
content.innerHTML = '<div class="error-state">Couldn\'t load leads: ' + escapeHtml(err.message) + '</div>';
countLabel.textContent = '';
}
}

function renderLeads(leads){
countLabel.textContent = leads.length + (leads.length === 1 ? ' lead' : ' leads');

if(leads.length === 0){
content.innerHTML = '<div class="empty-state">No leads yet. Submissions from the contact form will show up here.</div>';
return;
}

var rows = leads.map(function(lead){
var email = lead.email ? '<a href="mailto:' + escapeHtml(lead.email) + '">' + escapeHtml(lead.email) + '</a>' : '&mdash;';
var phone = lead.phone ? escapeHtml(lead.phone) : '&mdash;';
var message = lead.message ? escapeHtml(lead.message) : '&mdash;';
return '<tr data-id="' + lead.id + '">' +
'<td data-label="Name">' + escapeHtml(lead.name) + '</td>' +
'<td data-label="Email">' + email + '</td>' +
'<td data-label="Phone">' + phone + '</td>' +
'<td data-label="Message" class="msg-cell">' + message + '</td>' +
'<td data-label="Submitted" class="date-cell">' + formatDate(lead.createdAt) + '</td>' +
'<td data-label="Action"><button class="delete-btn" data-id="' + lead.id + '">Delete</button></td>' +
'</tr>';
}).join('');

content.innerHTML = '<table>' +
'<thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Submitted</th><th></th></tr></thead>' +
'<tbody>' + rows + '</tbody>' +
'</table>';

content.querySelectorAll('.delete-btn').forEach(function(btn){
btn.addEventListener('click', function(){
var id = btn.getAttribute('data-id');
deleteLead(id, btn);
});
});
}

async function deleteLead(id, btn){
if(!confirm('Delete this lead? This can\'t be undone.')) return;
btn.disabled = true;
btn.textContent = 'Deleting…';
try{
var res = await fetch('/api/leads/' + id, {method:'DELETE', credentials:'same-origin'});
if(!res.ok && res.status !== 204){
throw new Error('Delete failed with status ' + res.status);
}
loadLeads();
}catch(err){
alert('Couldn\'t delete lead: ' + err.message);
btn.disabled = false;
btn.textContent = 'Delete';
}
}

refreshBtn.addEventListener('click', loadLeads);
loadLeads();
</script>

</body>
</html>
