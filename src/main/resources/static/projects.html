<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Projects</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* This page (and testimonials.html) shares its look with index.html by
   design, not by a shared stylesheet - the whole site is a handful of
   self-contained static pages with no build step, so each one inlines its
   own copy the same way index.html and every admin/*.html page already do.
   The reset, header/nav, and footer blocks below are copied verbatim from
   index.html; keep them in sync by hand if either changes. */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

html,body{
overflow-x:hidden;
}

body{
background:#f7f7f7;
color:#333;
}

header{
position:fixed;
top:0;
width:100%;
background:#222;
padding:12px 5%;
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
/* Higher than nav's z-index (1000) below - header and nav are both
   position:fixed siblings of the body (not nested), so nav-toggle's own
   z-index:1002 only wins within HEADER's own stacking context; it does
   nothing against nav, a sibling with equal z-index that comes later in
   the DOM and would otherwise paint over the hamburger button (and swallow
   its clicks) the moment the off-canvas nav panel opens and its background
   covers that same top-right corner. Keeping header above nav is also just
   the right order for persistent chrome regardless. */
z-index:1001;
}

.logo{
font-size:clamp(18px,4.5vw,28px);
font-weight:700;
color:#ffb400;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:65vw;
text-decoration:none;
display:inline-block;
}

/* Absolute-positioned bars, not a column flex layout - on the fuller pages
   (index.html especially) flex-direction:column here made each bar's
   height:3px collapse to 0 (confirmed live: mutating the actual CSS rule
   had zero effect while flex-direction:column was active, but switching to
   row or display:block made it apply instantly - a flex column main-axis
   sizing quirk tied to overall page weight, not to this rule's own values).
   Absolute positioning is immune to that since these spans are no longer
   flex items at all; the three top offsets below reproduce the exact
   positions the old flex layout produced (0, 7.5, 15 - two 3px bars plus
   two 4.5px gaps from justify-content:space-between over 18px), so the
   .active transform math further down needs no changes. */
.nav-toggle{
position:relative;
width:24px;
height:18px;
background:none;
border:none;
padding:0;
cursor:pointer;
z-index:1002;
flex-shrink:0;
}

.nav-toggle span{
position:absolute;
left:0;
display:block;
height:3px;
width:100%;
background:#fff;
border-radius:2px;
transition:.3s;
}

.nav-toggle span:nth-child(1){top:0;}
.nav-toggle span:nth-child(2){top:7.5px;}
.nav-toggle span:nth-child(3){top:15px;}

.nav-toggle.active span:nth-child(1){
transform:translateY(7.5px) rotate(45deg);
}

.nav-toggle.active span:nth-child(2){
opacity:0;
}

.nav-toggle.active span:nth-child(3){
transform:translateY(-7.5px) rotate(-45deg);
}

nav{
display:flex;
flex-direction:column;
align-items:flex-start;
gap:6px;
position:fixed;
top:0;
right:0;
height:100vh;
width:min(78%,300px);
background:#222;
padding:90px 30px 30px;
box-shadow:-10px 0 30px rgba(0,0,0,.3);
transform:translateX(100%);
transition:transform .3s ease;
z-index:1000;
}

nav.open{
transform:translateX(0);
}

nav a{
text-decoration:none;
color:white;
transition:.3s;
width:100%;
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,.12);
}

nav a:hover,nav a.active{
color:#ffb400;
}

.nav-backdrop{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:999;
}

.nav-backdrop.open{
display:block;
}

body.nav-open-lock,body.lightbox-open-lock{
overflow:hidden;
}

.page-banner{
background:#222;
color:white;
text-align:center;
padding:130px 6% 50px;
}

.page-banner h1{
font-size:clamp(28px,5vw,44px);
margin-bottom:10px;
}

.page-banner p{
color:#bbb;
}

.page-banner a{
color:#ffb400;
text-decoration:none;
}

.page-banner a:hover{
text-decoration:underline;
}

section{
padding:60px 6%;
}

.empty-note{
text-align:center;
color:#888;
padding:40px 0;
}

.projects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.project-thumb{
display:block;
width:100%;
padding:0;
border:none;
background:none;
cursor:pointer;
border-radius:10px;
overflow:hidden;
}

.project-thumb img{
display:block;
width:100%;
border-radius:10px;
height:220px;
object-fit:cover;
transition:.3s;
}

.project-thumb:hover img,.project-thumb:focus-visible img{
transform:scale(1.05);
}

.project-caption{
margin-top:10px;
font-weight:600;
color:#222;
text-align:center;
}

.section-heading{
text-align:center;
font-size:clamp(22px,4vw,32px);
color:#222;
margin-bottom:8px;
}

.section-subheading{
text-align:center;
color:#777;
margin-bottom:30px;
}

.plan-filters{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
}

.plan-filter-btn{
border:1px solid #ddd;
background:#fff;
color:#444;
padding:8px 18px;
border-radius:30px;
cursor:pointer;
font-size:14px;
font-weight:500;
transition:.3s;
}

.plan-filter-btn:hover{
border-color:#ffb400;
}

.plan-filter-btn.active{
background:#ffb400;
border-color:#ffb400;
color:#222;
}

.plan-thumb{
position:relative;
}

.plan-badge{
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,.65);
color:#fff;
font-size:12px;
font-weight:600;
padding:4px 10px;
border-radius:20px;
}

.plan-play-icon{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:52px;
height:52px;
border-radius:50%;
background:rgba(0,0,0,.55);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
pointer-events:none;
}

.lightbox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:2000;
align-items:center;
justify-content:center;
padding:20px;
}

.lightbox.open{
display:flex;
}

.lightbox-img{
max-width:100%;
max-height:80vh;
border-radius:6px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.lightbox-caption{
position:absolute;
bottom:24px;
left:0;
width:100%;
text-align:center;
color:white;
font-size:16px;
padding:0 60px;
}

.lightbox-close{
position:absolute;
top:16px;
right:16px;
background:none;
border:none;
color:white;
font-size:32px;
line-height:1;
cursor:pointer;
padding:10px;
}

.lightbox-prev,.lightbox-next{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(255,255,255,.1);
border:none;
color:white;
font-size:20px;
width:46px;
height:46px;
border-radius:50%;
cursor:pointer;
transition:.3s;
}

.lightbox-prev:hover,.lightbox-next:hover{
background:rgba(255,255,255,.25);
}

.lightbox-prev{left:10px;}
.lightbox-next{right:10px;}

.lightbox-video-wrap{
width:min(90vw,960px);
aspect-ratio:16/9;
}

.lightbox-video-wrap iframe{
width:100%;
height:100%;
border:0;
border-radius:6px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

footer{
background:#111;
color:white;
text-align:center;
padding:30px;
}

@media(min-width:769px){

header{
padding:18px 8%;
}

.nav-toggle{
display:none;
}

nav{
position:static;
height:auto;
width:auto;
background:none;
padding:0;
box-shadow:none;
transform:none;
flex-direction:row;
gap:0;
}

nav a{
width:auto;
margin-left:30px;
padding:0;
border-bottom:none;
}

section{
padding:70px 8%;
}

.projects{
gap:25px;
}

.project-thumb img{
height:250px;
}

}

</style>

</head>

<body>

<header>

<a class="logo" id="site-logo" href="index.html" title="Home">BuildPro</a>

<button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
<span></span>
<span></span>
<span></span>
</button>

<nav id="site-nav">

<a href="index.html#home" data-nav-section="home">Home</a>
<a href="index.html#about" data-nav-section="about">About</a>
<a href="index.html#services" data-nav-section="services">Services</a>
<a href="projects.html" class="active" data-nav-section="projects">Projects</a>
<a href="index.html#contact" data-nav-section="contact">Contact</a>

</nav>

</header>

<div class="nav-backdrop" id="nav-backdrop"></div>

<div class="page-banner">

<h1>Our Projects</h1>
<p><a href="index.html">Home</a> / Projects</p>

</div>

<p class="empty-note" id="page-unavailable-note" style="display:none;padding:60px 6%;">This page isn't available right now.</p>

<section id="projects">

<div class="projects" id="projects-container"></div>

</section>

<section id="sample-plans">

<h2 class="section-heading">2D Sketch / 3D Animations</h2>
<p class="section-subheading">2D sketches and 3D animations from our recent work.</p>

<div class="plan-filters" id="plan-filters">
<button type="button" class="plan-filter-btn active" data-filter="all">All</button>
<button type="button" class="plan-filter-btn" data-filter="SKETCH_2D">2D Sketches</button>
<button type="button" class="plan-filter-btn" data-filter="ANIMATION_3D">3D Animations</button>
</div>

<div class="projects" id="plans-container"></div>

</section>

<footer>

&copy; 2026 <span id="footer-company-name">BuildPro Construction</span>. All Rights Reserved.

</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">

<button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>

<button type="button" class="lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#10094;</button>

<img class="lightbox-img" id="lightbox-img" src="" alt="">

<button type="button" class="lightbox-next" id="lightbox-next" aria-label="Next image">&#10095;</button>

<div class="lightbox-caption" id="lightbox-caption"></div>

</div>

<div class="lightbox" id="plan-lightbox" aria-hidden="true">

<button type="button" class="lightbox-close" id="plan-lightbox-close" aria-label="Close">&times;</button>

<button type="button" class="lightbox-prev" id="plan-lightbox-prev" aria-label="Previous">&#10094;</button>

<img class="lightbox-img" id="plan-lightbox-img" src="" alt="">

<div class="lightbox-video-wrap" id="plan-lightbox-video-wrap" hidden>
<iframe id="plan-lightbox-video" src="" title="3D animation" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<button type="button" class="lightbox-next" id="plan-lightbox-next" aria-label="Next">&#10095;</button>

<div class="lightbox-caption" id="plan-lightbox-caption"></div>

</div>

<script>

function escapeHtml(str){
if(str === undefined || str === null) return '';
return String(str).replace(/[&<>"']/g, function(m){
return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
});
}

var lightboxItems = [];
var lightboxIndex = 0;

var allPlans = [];
var planLightboxItems = [];
var planLightboxIndex = 0;
var currentPlanFilter = 'all';

function renderProjects(projects){
lightboxItems = projects || [];
var container = document.getElementById('projects-container');
if(lightboxItems.length === 0){
container.innerHTML = '<p class="empty-note">No projects yet — check back soon.</p>';
return;
}
container.innerHTML = lightboxItems.map(function(p, i){
return '<div><button type="button" class="project-thumb" data-index="' + i + '">' +
'<img src="' + p.imageUrl + '" alt="' + escapeHtml(p.title || 'Project') + '" loading="lazy"></button>' +
(p.title ? '<div class="project-caption">' + escapeHtml(p.title) + '</div>' : '') +
'</div>';
}).join('');
container.querySelectorAll('.project-thumb').forEach(function(btn){
btn.addEventListener('click', function(){
openLightbox(+btn.getAttribute('data-index'));
});
});
}

// Sample Plans grid - same card layout as renderProjects, plus a type badge
// and (for 3D Animation items) a play-icon overlay. Filtering is client-side
// over the one /api/content payload already fetched - no extra request per
// filter click.
var PLAN_TYPE_LABELS = {SKETCH_2D: '2D Sketch', ANIMATION_3D: '3D Animation'};

function renderPlans(plans){
allPlans = plans || [];
applyPlanFilter(currentPlanFilter);
}

function applyPlanFilter(filter){
currentPlanFilter = filter;
planLightboxItems = filter === 'all' ? allPlans : allPlans.filter(function(p){ return p.planType === filter; });

document.querySelectorAll('.plan-filter-btn').forEach(function(btn){
btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
});

var container = document.getElementById('plans-container');
if(!container) return;
if(planLightboxItems.length === 0){
container.innerHTML = '<p class="empty-note">No 2D sketches or 3D animations yet — check back soon.</p>';
return;
}
container.innerHTML = planLightboxItems.map(function(p, i){
var isVideo = p.planType === 'ANIMATION_3D';
return '<div><button type="button" class="project-thumb plan-thumb" data-index="' + i + '">' +
'<img src="' + p.imageUrl + '" alt="' + escapeHtml(p.title || '2D Sketch / 3D Animation') + '" loading="lazy">' +
(isVideo ? '<span class="plan-play-icon">&#9658;</span>' : '') +
'<span class="plan-badge">' + (PLAN_TYPE_LABELS[p.planType] || p.planType) + '</span>' +
'</button>' +
(p.title ? '<div class="project-caption">' + escapeHtml(p.title) + '</div>' : '') +
'</div>';
}).join('');
container.querySelectorAll('.plan-thumb').forEach(function(btn){
btn.addEventListener('click', function(){
openPlanLightbox(+btn.getAttribute('data-index'));
});
});
}

function setupPlanFilters(){
document.querySelectorAll('.plan-filter-btn').forEach(function(btn){
btn.addEventListener('click', function(){
applyPlanFilter(btn.getAttribute('data-filter'));
});
});
}

// Converts a YouTube/Vimeo "watch" URL into its embeddable form so it can sit
// inside an <iframe>; anything else (a direct video file, or a link that's
// already an embed URL) is passed through unchanged.
function toEmbedUrl(url){
if(!url) return '';
var youtube = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
if(youtube) return 'https://www.youtube.com/embed/' + youtube[1];
var vimeo = url.match(/vimeo\.com\/(\d+)/);
if(vimeo) return 'https://player.vimeo.com/video/' + vimeo[1];
return url;
}

function openPlanLightbox(index){
if(!planLightboxItems.length) return;
planLightboxIndex = index;
var lb = document.getElementById('plan-lightbox');
lb.classList.add('open');
lb.setAttribute('aria-hidden', 'false');
document.body.classList.add('lightbox-open-lock');
showPlanLightboxItem();
}

function closePlanLightbox(){
var lb = document.getElementById('plan-lightbox');
lb.classList.remove('open');
lb.setAttribute('aria-hidden', 'true');
document.body.classList.remove('lightbox-open-lock');
// Stop any playing video the moment the lightbox closes, rather than letting
// it keep running silently behind the scenes.
document.getElementById('plan-lightbox-video').src = '';
}

function showPlanLightboxItem(){
var item = planLightboxItems[planLightboxIndex];
if(!item) return;
var isVideo = item.planType === 'ANIMATION_3D' && item.videoUrl;
var img = document.getElementById('plan-lightbox-img');
var videoWrap = document.getElementById('plan-lightbox-video-wrap');
var video = document.getElementById('plan-lightbox-video');

if(isVideo){
img.hidden = true;
videoWrap.hidden = false;
video.src = toEmbedUrl(item.videoUrl);
}else{
videoWrap.hidden = true;
video.src = '';
img.hidden = false;
img.src = item.imageUrl;
img.alt = item.title || '2D Sketch / 3D Animation';
}

document.getElementById('plan-lightbox-caption').textContent = item.title || '';
var showNav = planLightboxItems.length > 1;
document.getElementById('plan-lightbox-prev').style.display = showNav ? '' : 'none';
document.getElementById('plan-lightbox-next').style.display = showNav ? '' : 'none';
}

function setupPlanLightbox(){
var lb = document.getElementById('plan-lightbox');
if(!lb) return;

document.getElementById('plan-lightbox-close').addEventListener('click', closePlanLightbox);

document.getElementById('plan-lightbox-prev').addEventListener('click', function(){
planLightboxIndex = (planLightboxIndex - 1 + planLightboxItems.length) % planLightboxItems.length;
showPlanLightboxItem();
});

document.getElementById('plan-lightbox-next').addEventListener('click', function(){
planLightboxIndex = (planLightboxIndex + 1) % planLightboxItems.length;
showPlanLightboxItem();
});

lb.addEventListener('click', function(e){
if(e.target === lb) closePlanLightbox();
});

document.addEventListener('keydown', function(e){
if(!lb.classList.contains('open')) return;
if(e.key === 'Escape') closePlanLightbox();
if(e.key === 'ArrowLeft') document.getElementById('plan-lightbox-prev').click();
if(e.key === 'ArrowRight') document.getElementById('plan-lightbox-next').click();
});
}

function openLightbox(index){
if(!lightboxItems.length) return;
lightboxIndex = index;
var lb = document.getElementById('lightbox');
lb.classList.add('open');
lb.setAttribute('aria-hidden', 'false');
document.body.classList.add('lightbox-open-lock');
showLightboxImage();
}

function closeLightbox(){
var lb = document.getElementById('lightbox');
lb.classList.remove('open');
lb.setAttribute('aria-hidden', 'true');
document.body.classList.remove('lightbox-open-lock');
}

function showLightboxImage(){
var item = lightboxItems[lightboxIndex];
if(!item) return;
var img = document.getElementById('lightbox-img');
img.src = item.imageUrl;
img.alt = item.title || 'Project';
document.getElementById('lightbox-caption').textContent = item.title || '';
var showNav = lightboxItems.length > 1;
document.getElementById('lightbox-prev').style.display = showNav ? '' : 'none';
document.getElementById('lightbox-next').style.display = showNav ? '' : 'none';
}

function setupLightbox(){
var lb = document.getElementById('lightbox');
if(!lb) return;

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);

document.getElementById('lightbox-prev').addEventListener('click', function(){
lightboxIndex = (lightboxIndex - 1 + lightboxItems.length) % lightboxItems.length;
showLightboxImage();
});

document.getElementById('lightbox-next').addEventListener('click', function(){
lightboxIndex = (lightboxIndex + 1) % lightboxItems.length;
showLightboxImage();
});

lb.addEventListener('click', function(e){
if(e.target === lb) closeLightbox();
});

document.addEventListener('keydown', function(e){
if(!lb.classList.contains('open')) return;
if(e.key === 'Escape') closeLightbox();
if(e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
if(e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
});
}

function renderCompanyInfo(info){
if(!info) return;
var name = (info.companyName || '').trim() || 'BuildPro Construction';
document.title = 'Our Projects | ' + name;
var footerNameEl = document.getElementById('footer-company-name');
if(footerNameEl) footerNameEl.textContent = name;
var logoEl = document.getElementById('site-logo');
if(logoEl) logoEl.textContent = name;
}

// The admin's "Section Visibility" master config (see SiteSectionSettings) -
// hides a whole <section> (and, for the five sections that have one, its nav
// link) when its flag is off. Same function as index.html/testimonials.html;
// elements/links this page doesn't have (about/services/stats/home/contact
// have no <section> here) are simply skipped via the `el &&` guard.
function applySectionVisibility(settings){
if(!settings) return;
var flags = {
home: settings.showHome,
about: settings.showAbout,
services: settings.showServices,
stats: settings.showStats,
projects: settings.showProjects,
'sample-plans': settings.showSamplePlans,
testimonials: settings.showTestimonials,
contact: settings.showContact
};
Object.keys(flags).forEach(function(key){
var el = document.getElementById(key);
// Inline style, not the `hidden` attribute - see the identical comment in
// index.html's copy of this function (some sections' own CSS sets `display`
// directly, which would otherwise beat [hidden] at equal specificity).
if(el) el.style.display = flags[key] ? '' : 'none';
});
document.querySelectorAll('[data-nav-section]').forEach(function(link){
var key = link.getAttribute('data-nav-section');
if(flags.hasOwnProperty(key)) link.style.display = flags[key] ? '' : 'none';
});

// This whole page is just the Projects and Sample Plans sections - if an
// admin has switched both off, show one friendly notice instead of a page
// that's just header/banner/footer with nothing in between.
var noteEl = document.getElementById('page-unavailable-note');
if(noteEl) noteEl.style.display = (flags.projects || flags['sample-plans']) ? 'none' : '';
}

async function loadContent(){
try{
var res = await fetch('/api/content');
if(!res.ok) throw new Error('request failed: ' + res.status);
var data = await res.json();
renderProjects(data.projects);
renderPlans(data.samplePlans);
renderCompanyInfo(data.companyInfo);
applySectionVisibility(data.sectionSettings);
}catch(err){
console.error('Failed to load site content from /api/content', err);
document.getElementById('projects-container').innerHTML =
'<p class="empty-note">Couldn’t load projects right now — please try again shortly.</p>';
document.getElementById('plans-container').innerHTML =
'<p class="empty-note">Couldn’t load 2D sketches / 3D animations right now — please try again shortly.</p>';
}
}

function setupMobileNav(){
var toggle = document.getElementById('nav-toggle');
var nav = document.getElementById('site-nav');
var backdrop = document.getElementById('nav-backdrop');
if(!toggle || !nav || !backdrop) return;

function closeNav(){
nav.classList.remove('open');
backdrop.classList.remove('open');
toggle.classList.remove('active');
toggle.setAttribute('aria-expanded', 'false');
document.body.classList.remove('nav-open-lock');
}

function openNav(){
nav.classList.add('open');
backdrop.classList.add('open');
toggle.classList.add('active');
toggle.setAttribute('aria-expanded', 'true');
document.body.classList.add('nav-open-lock');
}

toggle.addEventListener('click', function(){
if(nav.classList.contains('open')){
closeNav();
}else{
openNav();
}
});

backdrop.addEventListener('click', closeNav);

nav.querySelectorAll('a').forEach(function(link){
link.addEventListener('click', closeNav);
});

window.addEventListener('resize', function(){
if(window.innerWidth > 768){
closeNav();
}
});
}

document.addEventListener('DOMContentLoaded', function(){
loadContent();
setupMobileNav();
setupLightbox();
setupPlanLightbox();
setupPlanFilters();
});

</script>

</body>

</html>
